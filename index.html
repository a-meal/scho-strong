<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Min-Max">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#141210">
<title>Min-Max Log</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%23141210'/><rect x='28' y='80' width='124' height='20' rx='5' fill='%23E8542A'/><rect x='16' y='62' width='18' height='56' rx='5' fill='%23EDE9E2'/><rect x='146' y='62' width='18' height='56' rx='5' fill='%23EDE9E2'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23141210'/><rect x='10' y='27' width='44' height='10' rx='3' fill='%23E8542A'/><rect x='6' y='21' width='7' height='22' rx='2' fill='%23EDE9E2'/><rect x='51' y='21' width='7' height='22' rx='2' fill='%23EDE9E2'/></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400..600&display=swap');
:root{--ink:#141210;--surf:#1F1C18;--surf2:#2A2520;--line:#312C26;--line2:#4A443B;
--bone:#F4F1E9;--txt2:#BDB5A8;--mut:#8C8479;--dim:#5A5147;--ghost:#3A342D;
--amber:#FF6B3D;--accFill:#E8542A;--accOn:#FFFFFF;--up:#7BD88F;--down:#F0724A;
--info:var(--info);--alt:#C79BF2;--grid:#2A2520;--panel2:#1A1713;--hair:#2A2520;
--disp:'Anton',Impact,sans-serif;
--body:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
--mono:'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,monospace;--stretch:100%;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--ink);}
body{color:var(--bone);font-family:var(--body);min-height:100vh;padding-bottom:104px;-webkit-font-smoothing:antialiased;}
.disp{font-family:var(--disp);text-transform:uppercase;font-weight:400;letter-spacing:.015em;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
button{font-family:var(--body);}
header{position:sticky;top:0;z-index:30;background:var(--ink);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);}
.bar{display:flex;align-items:center;gap:9px;padding:10px 13px;}
.brand{flex:1;font-family:var(--disp);text-transform:uppercase;font-size:12.6px;font-weight:700;letter-spacing:.015em;color:var(--mut);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.save{font-size:11px;color:var(--mut);min-width:38px;text-align:right;}
.seg{display:flex;gap:2px;background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:2px;}
.seg button{border:0;background:transparent;color:var(--mut);font-weight:500;font-size:12.5px;padding:5px 10px;border-radius:7px;cursor:pointer;}
.seg button.on{background:var(--surf2);color:var(--bone);}
.nav{display:flex;align-items:center;gap:8px;padding:0 10px 9px;}
.sq{width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--bone);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sq:active{background:var(--surf2);}
.title{flex:1;text-align:center;min-width:0;}
.title .d{font-family:var(--disp);text-transform:uppercase;font-size:18.9px;font-weight:800;letter-spacing:.015em;line-height:1.05;}
.title .w{font-size:11.5px;color:var(--mut);margin-top:3px;}
.title .w em{font-style:normal;color:var(--amber);font-weight:600;}
.dots{display:flex;gap:5px;padding:0 13px 9px;}
.dot{height:4px;flex:1;border-radius:2px;background:var(--line);cursor:pointer;}
.dot.rest{background:var(--panel2);}.dot.done{background:var(--up);}.dot.on{background:var(--amber);}
.wrap{padding:13px;max-width:860px;margin:0 auto;}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;}
.card.done{border-color:var(--up);}
.card.skipped{opacity:.5;}
.top{display:flex;gap:10px;padding:13px 13px 9px;align-items:flex-start;}
.idx{font-family:var(--mono);font-size:11px;color:var(--mut);padding-top:5px;width:22px;flex:0 0 22px;}
.nm{font-family:var(--disp);text-transform:uppercase;font-size:15.3px;line-height:1.18;font-weight:700;letter-spacing:.015em;}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--surf2);color:var(--mut);border:1px solid transparent;white-space:nowrap;}
.chip b{color:var(--bone);font-weight:600;}
.chip.tech{background:rgba(232,84,42,.12);color:var(--amber);border-color:rgba(232,84,42,.3);}
.chip.fail{background:rgba(240,114,74,.13);color:var(--down);border-color:rgba(240,114,74,.28);}
.flag{display:flex;gap:9px;align-items:flex-start;margin:0 13px 10px;padding:8px 10px;border-radius:9px;font-size:12.5px;line-height:1.45;}
.flag.up{background:rgba(232,84,42,.1);border:1px solid rgba(232,84,42,.28);color:var(--amber);}
.flag.hold{background:rgba(134,141,159,.1);border:1px solid var(--line);color:var(--txt2);}
.flag .lab{font-family:var(--disp);text-transform:uppercase;font-size:12.5px;font-weight:700;letter-spacing:.015em;flex:0 0 auto;white-space:nowrap;}
.sets{display:flex;gap:8px;padding:2px 13px 11px;}
.set{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:8px 9px 8px;}
.set.filled{border-color:var(--line2);}
.setlab{font-size:11px;font-weight:500;color:var(--mut);display:flex;justify-content:space-between;gap:6px;}
.in{display:flex;align-items:baseline;gap:5px;margin-top:5px;}
.in input{width:100%;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--bone);font-family:var(--mono);font-size:19px;font-weight:500;padding:2px 0 3px;outline:none;text-align:center;letter-spacing:.015em;}
.in input:focus{border-color:var(--amber);}
.in input::placeholder{color:var(--ghost);}
.in .rp{max-width:54px;}
.x{color:var(--mut);font-family:var(--mono);font-size:13px;}
.uline{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:5px;}
.uline .u{font-size:10.5px;color:var(--mut);}
.uline .rw{display:flex;align-items:center;gap:4px;}
.uline .rw span{font-size:10.5px;color:var(--dim);}
.uline .rw input{width:28px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--txt2);font-family:var(--mono);font-size:12px;text-align:center;padding:0 0 2px;outline:none;}
.uline .rw input:focus{border-color:var(--amber);color:var(--bone);}
.uline .rw input::placeholder{color:var(--ghost);}
.prev{display:flex;align-items:center;gap:8px;padding:0 13px 10px;flex-wrap:wrap;}
.pv{font-family:var(--mono);font-size:11.5px;color:var(--mut);letter-spacing:.015em;}
.pv b{color:var(--txt2);font-weight:500;}
.delta{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:5px;letter-spacing:.015em;}
.delta.u{background:rgba(123,216,143,.12);color:var(--up);}
.delta.d{background:rgba(240,114,74,.12);color:var(--down);}
.delta.e{background:var(--surf2);color:var(--mut);}
.btn{border:1px solid var(--line);background:var(--surf2);color:var(--bone);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:12.5px;font-weight:500;letter-spacing:.015em;}
.btn:active{background:var(--surf2);}
.btn.amber{background:var(--amber);color:var(--accOn);border-color:var(--amber);font-weight:600;}
.btn.ghost{background:transparent;color:var(--mut);}
.btn.wide{width:100%;padding:11px;}
.foot{display:flex;gap:7px;padding:0 13px 12px;flex-wrap:wrap;align-items:center;}
.detail{border-top:1px solid var(--line);padding:12px 13px;background:var(--panel2);font-size:13.5px;line-height:1.6;color:var(--txt2);}
.detail h5{margin:0 0 5px;font-size:11.5px;font-weight:600;color:var(--mut);}
.blk{margin-bottom:12px;}.blk:last-child{margin-bottom:0;}
.note{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--bone);padding:8px 10px;font-family:var(--body);font-size:13.5px;resize:vertical;outline:none;}
.note:focus{border-color:var(--amber);}
.hist{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;letter-spacing:.015em;}
.hist td{padding:4px 0;border-bottom:1px solid var(--hair);color:var(--txt2);}
.hist td:first-child{color:var(--mut);width:66px;}
.skipbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;}
.skipbar span{font-size:13px;color:var(--mut);}
.bw{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;}
.bw label{font-size:12.5px;color:var(--mut);flex:1;}
.bw input{width:90px;background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--bone);font-family:var(--mono);font-size:16px;text-align:center;padding:6px 4px;outline:none;letter-spacing:.015em;}
.bw input:focus{border-color:var(--amber);}
.bw .u{font-size:11.5px;color:var(--mut);}
.wk h3{font-family:var(--disp);text-transform:uppercase;font-size:15.8px;font-weight:700;letter-spacing:.015em;margin:20px 0 3px;cursor:pointer;}
.wk table{width:100%;border-collapse:collapse;}
.wk th{font-size:11.5px;font-weight:600;color:var(--mut);text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);}
.wk td{padding:7px 5px;border-bottom:1px solid var(--hair);font-size:13px;vertical-align:middle;}
.wk td.n{font-family:var(--mono);font-size:11.5px;color:var(--txt2);white-space:nowrap;letter-spacing:.015em;}
.wk td.sk{color:var(--dim);text-decoration:line-through;}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:14px;}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:11px 12px;}
.tile .k{font-size:11.5px;font-weight:500;color:var(--mut);}
.tile .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;line-height:1.1;letter-spacing:.015em;}
.tile .s{font-size:11px;color:var(--dim);margin-top:3px;}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px;}
.panel h4{font-family:var(--disp);text-transform:uppercase;font-size:14.4px;font-weight:700;letter-spacing:.015em;margin:0 0 4px;}
.panel p.sub{margin:0 0 11px;font-size:12.5px;color:var(--mut);line-height:1.5;}
.panel .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.subhead{font-size:11.5px;font-weight:600;color:var(--mut);margin:0 0 6px;}
select{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--bone);padding:9px 10px;font-family:var(--body);font-size:14px;outline:none;margin-bottom:11px;-webkit-appearance:none;appearance:none;}
select:focus{border-color:var(--amber);}
svg.chart{display:block;width:100%;height:auto;overflow:visible;}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--mut);align-items:center;}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px;}
.rank{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:13.5px;}
.rank:last-child{border-bottom:0;}
.rank .r{font-family:var(--mono);font-size:11.5px;white-space:nowrap;letter-spacing:.015em;}
.empty{color:var(--mut);font-size:13px;line-height:1.55;margin:0;}
.hbar{display:grid;grid-template-columns:80px 1fr 66px;align-items:center;gap:9px;padding:5px 0;}
.hbar .lb{font-size:12px;font-weight:500;color:var(--txt2);}
.hbar .tr{height:9px;background:var(--surf2);border-radius:4px;overflow:hidden;}
.hbar .fl{height:100%;border-radius:4px;}
.hbar .vl{font-family:var(--mono);font-size:11px;color:var(--mut);text-align:right;letter-spacing:.015em;}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:9px 13px calc(9px + env(safe-area-inset-bottom));}
.timer .lab{display:flex;justify-content:space-between;max-width:860px;margin:0 auto 6px;font-size:11.5px;color:var(--mut);gap:10px;}
.timer .lab span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.timer .row{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto;}
.clock{font-family:var(--mono);font-size:24px;font-weight:600;min-width:80px;letter-spacing:.015em;}
.clock.zero{color:var(--up);}
.track{flex:1;height:6px;background:var(--surf2);border-radius:3px;overflow:hidden;}
.fill{height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .25s linear;}
.tb{width:42px;height:42px;flex:0 0 42px;border-radius:11px;border:1px solid var(--line);background:var(--surf);color:var(--bone);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sheet{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;}
.sheet[hidden]{display:none;}
.box{background:var(--surf);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:860px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;}
.box h3{font-family:var(--disp);text-transform:uppercase;font-size:18.0px;font-weight:800;letter-spacing:.015em;margin:0 0 10px;}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:15px;}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--hair);font-size:14px;}
.row2 .hint{font-size:11.5px;color:var(--mut);margin-top:3px;line-height:1.45;}
.srow{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;padding:6px 0;}
.srow .dl{font-size:12.5px;color:var(--mut);}
.srow .dl b{display:block;color:var(--bone);font-size:13.5px;font-weight:600;}
.srow select{margin:0;padding:8px 9px;font-size:13.5px;}
.srow.isrest select{color:var(--mut);}
input[type=date]{background:var(--ink);border:1px solid var(--line);border-radius:8px;color:var(--bone);padding:7px 9px;font-family:var(--mono);font-size:12.5px;outline:none;}
.fine{font-size:12px;color:var(--mut);line-height:1.6;margin-top:12px;}
.danger{color:var(--down);}
.epic{text-align:center;}
.epicnum{line-height:1;}
.epicnum span{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:.015em;color:var(--amber);display:block;}
.epicnum em{display:block;font-style:normal;font-size:12px;color:var(--mut);margin-top:7px;letter-spacing:0;}
.epicsub{font-size:13.5px;color:var(--txt2);margin-top:10px;line-height:1.5;}
.epicnext{margin-top:12px;}
.epicnext span{display:inline-block;font-size:11.5px;color:var(--amber);background:rgba(232,84,42,.1);border:1px solid rgba(232,84,42,.3);border-radius:999px;padding:6px 13px;}
.epicfoot{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:11px;letter-spacing:.015em;}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.badge{text-align:center;cursor:pointer;min-width:0;}
.badge .bi{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ghost);font-size:21px;}
.badge.on .bi{background:rgba(232,84,42,.12);border-color:rgba(232,84,42,.4);color:var(--amber);}
.badge .bn{font-size:10px;color:var(--dim);margin-top:6px;line-height:1.25;}
.badge.on .bn{color:var(--txt2);}
.badge .bp{font-family:var(--mono);font-size:9.5px;color:var(--ghost);margin-top:2px;letter-spacing:.015em;}
.bigbadge{width:86px;height:86px;margin:0 auto;border-radius:22px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ghost);font-size:40px;}
.bigbadge.on{background:rgba(232,84,42,.12);border-color:rgba(232,84,42,.45);color:var(--amber);}
.chips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.chips .chip{cursor:pointer;background:var(--surf2);border:1px solid transparent;color:var(--txt2);}
.chips .chip.on{background:var(--amber);color:var(--accOn);}
@media(max-width:360px){.bgrid{grid-template-columns:repeat(2,1fr);}}

body{padding-bottom:calc(76px + env(safe-area-inset-bottom));}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;background:var(--ink);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 2px calc(7px + env(safe-area-inset-bottom));}
.tabbar button{flex:1;border:0;background:transparent;color:var(--dim);font-family:var(--body);font-size:10px;font-weight:500;cursor:pointer;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;}
.tabbar button .ti{font-size:20px;line-height:1;}
.tabbar button.on{color:var(--amber);}
.tabbar button em{display:none;}
.tabbar button.live em{display:block;position:absolute;top:1px;right:50%;margin-right:-15px;width:7px;height:7px;border-radius:50%;background:var(--amber);}
.timerbar{position:fixed;left:0;right:0;bottom:calc(69px + env(safe-area-inset-bottom));z-index:44;background:var(--ink);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 13px 9px;cursor:pointer;}
.timerbar[hidden]{display:none;}
.timerbar .row{display:flex;align-items:center;gap:9px;max-width:860px;margin:0 auto;}
.timerbar .tlab{max-width:860px;margin:4px auto 0;font-size:10.5px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.timerbar .clock{font-family:var(--mono);font-size:21px;font-weight:600;min-width:62px;letter-spacing:.015em;color:var(--amber);}
.timerbar .clock.zero{color:var(--up);}
.timerbar .track{flex:1;height:5px;background:var(--surf2);border-radius:3px;overflow:hidden;}
.timerbar .fill{height:100%;width:0;background:var(--amber);border-radius:3px;transition:width .25s linear;}
.timerbar .tb{width:34px;height:34px;flex:0 0 34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);color:var(--bone);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.btn.demo{text-decoration:none;display:inline-flex;align-items:center;color:var(--info);border-color:rgba(95,180,245,.3);}
.subpair{display:inline-flex;gap:4px;align-items:center;}
.subpair .btn.demo{padding:6px 8px;font-size:11px;}

.sets.grid{display:grid;grid-template-columns:repeat(2,1fr);}
.setlab{gap:5px;}
.sets.grid .in input{font-size:17px;}
.progcard .pm{white-space:normal;}

.progcard{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;}
.progcard.on{border-color:var(--amber);}
.progcard .pt{font-family:var(--disp);text-transform:uppercase;font-size:14.4px;font-weight:700;letter-spacing:.015em;}
.progcard .pnow{font-family:var(--body);font-size:11px;font-weight:500;color:var(--amber);letter-spacing:0;}
.progcard .pb{font-size:12.5px;color:var(--mut);line-height:1.5;margin-top:5px;}
.progcard .pm{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px;letter-spacing:.015em;}

.addrow2{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:12px;}
.addrow2 .btn{padding:10px 4px;text-align:center;}
.micros{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:11px;padding-top:10px;border-top:1px solid var(--hair);font-size:11.5px;color:var(--mut);}
.micros b{font-family:var(--mono);color:var(--txt2);font-weight:500;letter-spacing:.015em;}
.mealhd{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mut);padding-bottom:5px;border-bottom:1px solid var(--hair);}

.finishbtn{background:var(--surf2);border-color:var(--line2);font-weight:600;}
.finhint{font-size:11.5px;color:var(--mut);text-align:center;margin-top:7px;}

.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}

.bigstat{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.015em;line-height:1;margin:2px 0 3px;}

.setlab,.tile .k,.detail h5,.subhead,.wk th,.bw label,.uline .u,.uline .rw span,.chip,.btn,.mealhd,.tabbar button,.epicnum em,.epicfoot,.legend,.badge .bn,.progcard .pm,.finhint,.save{text-transform:uppercase;letter-spacing:.06em;font-weight:700;}

.dot.on{background:var(--accFill);border-color:var(--accFill);}
.badge .bi{border-color:var(--dotline);}
.epicnum em{color:var(--amber);}

border:1px solid currentColor;font-size:9px;font-style:normal;margin-left:5px;opacity:.75;vertical-align:1px;letter-spacing:0;}

t aligned in a straight line throughout the pull. Feel a nice, deep lat stretch at the top.","muscle":"Back","yt":"https://youtu.be/8W67lZ5mwTU","sub1yt":"https://youtu.be/r8K1Fkch5go","sub2yt":"https://youtu.be/b0ypSz63UGo"},{"day":"Upper #1","name":"Low Incline Smith Machine Press","b":1,"sup":"","warmup":"2-3","sets":"4","reps":"8-10","rest":"~2-3 min","sub1":"Low Incline Machine Press","sub2":"Low Incline DB Press","notes":"Set the bench at a ~15\u00b0 incline. 1 second pause on the chest on each rep while maintaining tension on the pecs.","muscle":"Chest","yt":"https://youtu.be/2ITgeRy2z2s","sub1yt":"https://youtu.be/JmsY9nSqX9E","sub2yt":"https://youtu.be/YmlMsvNGTKA"},{"day":"Upper #1","name":"Chest-Supported Machine Row","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Chest-Supported T-Bar Row","sub2":"Helms Row","notes":"Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","muscle":"Back","yt":"https://youtu.be/QZ7VZpjNTG8","sub1yt":"https://youtu.be/-FAxUZoPDc4","sub2yt":"https://youtu.be/DjO2G9DIerQ"},{"day":"Upper #1","name":"Overhead Cable Triceps Extension (Bar)","b":1,"sup":"","warmup":"1","sets":"2","reps":"8-10","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Rope)","sub2":"DB Skull Crusher","notes":"Feel a nasty stretch on the triceps throughout the entire negative. Pause for 1 second in the stretch part of each rep.","muscle":"Triceps","yt":"https://youtu.be/9_I1PqZAjdA","sub1yt":"https://youtu.be/GYoUoVNlbGc","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Upper #1","name":"Straight-Bar Lat Prayer","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Machine Lat Pullover","sub2":"DB Lat Pullover","notes":"Lean forward to get a big stretch on the lats at the top of the ROM and then stand upright as you squeeze your lats at the bottom.","muscle":"Back","yt":"https://youtu.be/YrcnBlH8XDA","sub1yt":"https://youtu.be/YT0K0PBl3nk","sub2yt":"https://youtu.be/iaRefVKBH8M"},{"day":"Upper #1","name":"Pec Deck (w/ Integrated Partials)","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Bent-Over Cable Pec Flye (w/ Integrated Partials)","sub2":"DB Flye (w/ Integrated Partials)","notes":"Set up the pec deck to allow for maximum stretch. On all sets, alternate full-ROM reps and half-ROM reps (i.e. do 1 rep with full-ROM, then 1 rep half-ROM (in the stretched/bottom half), then 1 rep full-ROM, then 1 rep half-ROM). Repeat until you've reached the target reps and an RPE of 9-10.","muscle":"Chest","yt":"https://youtu.be/NPa8YvUg4CM","sub1yt":"https://youtu.be/DKaKmnB0BO8","sub2yt":"https://youtu.be/AOsdioes78c"},{"day":"Lower #1","name":"Seated Leg Curl","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Lower #1","name":"Machine Hip Adduction","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Lower #1","name":"Hack Squat","b":1,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-5 min","sub1":"Machine Squat","sub2":"Front Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/TWUnnDK8rck","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/TRwhJ0TCoqI"},{"day":"Lower #1","name":"Leg Extension","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Lower #1","name":"Leg Press Calf Press","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Donkey Calf Raise","sub2":"Seated Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/-mcxziH_KdM","sub1yt":"https://youtu.be/LC9SO-pIXqA","sub2yt":"https://youtu.be/6pfj0G7VKdM"},{"day":"Upper #2","name":"Super-ROM Overhand Cable Row","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Overhand Machine Row","sub2":"Arm-Out Single-Arm DB Row","notes":"Set up a wide grip pulldown bar on a seated cable row. Using a double overhand grip, perform rows while leaning forward on the negative and then extend your torso to be upright as you finish the row.","muscle":"Back","yt":"https://youtu.be/a7AH8W7dQIw","sub1yt":"https://youtu.be/WtokJfvWl-I","sub2yt":"https://youtu.be/1ydRu2K6oHg"},{"day":"Upper #2","name":"Machine Shoulder Press","b":1,"sup":"","warmup":"2-3","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Shoulder Press","sub2":"Seated DB Shoulder Press","notes":"Ensure that your elbows break at least 90\u00b0. Mind-muscle connection with your delts. Smooth, controlled reps.","muscle":"Delts","yt":"https://youtu.be/SCQVmN1gYsk","sub1yt":"https://youtu.be/OfjncdW_Vyc","sub2yt":"https://youtu.be/B8PB5RPhTWQ"},{"day":"Upper #2","name":"Assisted Pull-Up","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Lat Pulldown","sub2":"Machine Pulldown","notes":"Slow 2-3 second negative. Feel your lats pulling apart on the way down. Slight 0.5-1 second pause at the bottom, then lift your chest up and drive your elbows down as you lift yourself up. Don't be afraid to use assistance. Keep the form tight and controlled!","muscle":"Back","yt":"https://youtu.be/iZQNHZuvfUQ","sub1yt":"https://youtu.be/IAktPXPhWYQ","sub2yt":"https://youtu.be/kd6rshRa164"},{"day":"Upper #2","name":"Paused Assisted Dip","b":1,"sup":"","warmup":"2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Decline Machine Chest Press","sub2":"Decline Barbell Press","notes":"Slow 2-3 second negative. 1-2 second pause at the bottom. Explode with control on the way up. Go as deep as your shoulders comfortably allow, trying to at least break a 90\u00b0 elbow angle.","muscle":"Chest","yt":"https://youtu.be/RyGOGviYWts","sub1yt":"https://youtu.be/AABuMGK9H28","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Upper #2","name":"Inverse DB Zottman Curl","b":1,"sup":"","warmup":"1","sets":"2","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Curl","sub2":"Hammer Curl","notes":"Do a hammer curl on the positive, then turn your palms facing up at the top and use a palms-up grip on the negative.","muscle":"Biceps","yt":"https://youtu.be/jBIvbpyb99M","sub1yt":"https://youtu.be/49VVIiqqOOs","sub2yt":"https://youtu.be/xY3sQXYhk7A"},{"day":"Upper #2","name":"Super-ROM DB Lateral Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~0.5-1 min","sub1":"Cable Upright Row","sub2":"DB Lateral Raise","notes":"Perform lateral raises as normal, except going until your hands are up overhead. As you break parallel, you will use more upper traps to move the weight. Feel free to squeeze your upper traps at the top. If you feel shoulder pain when going all the way up, try pointing your thumb up or simply stop at parallel and do normal lateral raises.","muscle":"Delts","yt":"https://youtu.be/nW5pGot-Hok","sub1yt":"https://youtu.be/Rm7CPzKLK1M","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Upper #2","name":"Cable Reverse Flye (Mechanical Dropset)","b":1,"sup":"","warmup":"0","sets":"3","reps":"5,4,3+","rest":"~1-2 min","sub1":"Reverse Pec Deck","sub2":"Bent-Over Reverse DB Flye","notes":"You'll probably want to watch the video for this one. Take ~3 big steps back from the cable machine and do your first 5 reps. After those first 5 reps, immediately (without resting) take 1 step forward and do another 4 reps. Then (without resting) take another step forward and do at least another 3 reps (or until you hit RPE 9-10).","muscle":"Delts","yt":"https://youtu.be/nN5RV1arpfM","sub1yt":"https://youtu.be/Y8fb_rtEU_4","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Lower #2","name":"Lying Leg Curl","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~1-2 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl. Once you can't get to the full squeeze, continue with partial reps on the last set.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Lower #2","name":"Leg Press","b":1,"sup":"","warmup":"2-4","sets":"3","reps":"8","rest":"~1-2 min","sub1":"Belt Squat","sub2":"High-Bar Back Squat","notes":"Feet lower on the platform for more quad focus. Get as deep as you can without excessive back rounding. Control the negative and do a slight pause at the bottom of each rep. Try to add a little weight each week at the same rep count.","muscle":"Quads","yt":"https://youtu.be/ksBaBSfmZf4","sub1yt":"https://youtu.be/JvAc3k4Jdqw","sub2yt":"https://youtu.be/V-B_Y-OvOTQ"},{"day":"Lower #2","name":"Paused Barbell RDL","b":1,"sup":"","warmup":"2-3","sets":"2","reps":"8","rest":"~3-4 min","sub1":"Paused DB RDL","sub2":"Glute-Ham Raise","notes":"The RPE is intentionally low here because these will cause a lot of muscle damage. Don't be tempted to go too heavy. 1 second pause at the bottom of each rep. To keep tension on the hamstrings, stop about 75% of the way to full lockout on each rep (i.e. stay in the bottom 3/4 of the range of motion).","muscle":"Hamstrings","yt":"https://youtu.be/74uXdbCYZQY","sub1yt":"https://youtu.be/gzavDZmYDHk","sub2yt":"https://youtu.be/9ksG-O0ZUto"},{"day":"Lower #2","name":"Machine Hip Adduction","b":1,"sup":"A1","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Lower #2","name":"Sissy Squat","b":1,"sup":"A2","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Leg Extension","sub2":"Goblet Squat","notes":"Allow yourself to come up onto your toes and push your knees forward past your toes. This is safe for the knees.  If you feel knee pain doing them, though, feel free to go with a substitution. They may feel awkward at first, but they're really underrated for the quads! Don't give up on them too quickly.","muscle":"Quads","yt":"https://youtu.be/Ma99aw-VDJQ","sub1yt":"https://youtu.be/G0_M9LBCT0o","sub2yt":"https://youtu.be/S2agsLlUSII"},{"day":"Lower #2","name":"Standing Calf Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Leg Press Calf Press","sub2":"Donkey Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/WMkCGNwo5ts","sub1yt":"https://youtu.be/-mcxziH_KdM","sub2yt":"https://youtu.be/LC9SO-pIXqA"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 1","b":1,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 2 (optional)","b":1,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Bayesian Cable Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Incline Curl","sub2":"DB Scott Curl","notes":"If you have a left-right bicep size imbalance, do these 1 arm at a time, starting with the weaker arm. Take the weaker arm to an RPE of 9-10. Then match the reps with the other arm (stop once you've matched the reps, even if the RPE is lower). If you don't have a size imbalance, do these both arms at the same time.","muscle":"Biceps","yt":"https://youtu.be/_w_Uan2dG-4","sub1yt":"https://youtu.be/KSJc8bhSjB0","sub2yt":"https://youtu.be/u00CqDeAHTE"},{"day":"Arms & Weak Points","name":"Seated DB French Press","b":1,"sup":"","warmup":"1","sets":"3","reps":"10","rest":"~1-2 min","sub1":"EZ-bar Skull Crusher","sub2":"DB Skull Crusher","notes":"Place both palms under the head of a dumbbell and perform overhead extensions. Feel a deep stretch on your triceps at the bottom. Avoid pausing at the top of each rep.","muscle":"Triceps","yt":"https://youtu.be/5KX0EjOTMaI","sub1yt":"https://youtu.be/oDKGCsTjAk8","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Arms & Weak Points","name":"Bottom-2/3 Constant Tension Preacher Curl","b":1,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bottom-2/3 EZ-Bar Curl","sub2":"Spider Curl","notes":"Stay in the bottom 2/3 of the curl. Don't squeeze all the way up to the top. Keep your triceps firmly pinned against the pad as you curl. No pausing at the top or bottom: constant tension on the biceps!","muscle":"Biceps","yt":"https://youtu.be/vHBedP8oeCA","sub1yt":"https://youtu.be/fXI8gN6pq1k","sub2yt":"https://youtu.be/jw9tvoGLJmo"},{"day":"Arms & Weak Points","name":"Cable Triceps Kickback","b":1,"sup":"","warmup":"0","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bench Dip","sub2":"DB Triceps Kickback","notes":"There are two ways you can do this: upright or bent over. Choose the one that feels more comfortable for you. The main thing is that when you're in the full squeeze, your shoulder should be positioned back behind your torso.","muscle":"Triceps","yt":"https://youtu.be/FGJ64JyKod0","sub1yt":"https://youtu.be/3CaIq8jZe18","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points","name":"Cable Crunch","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Crunch","sub2":"Plate-Weighted Crunch","notes":"Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","muscle":"Abs","yt":"https://youtu.be/LvJM9V3D_CQ","sub1yt":"https://youtu.be/KlxdhDSi5Dc","sub2yt":"https://youtu.be/mP99WSRI6Bc"},{"day":"Upper #1","name":"Cuffed Behind-The-Back Lateral Raise","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cross-Body Cable Y-Raise","sub2":"DB Lateral Raise","notes":"Raise the cables up in a \"Y\" motion. Really try to connect with the middle delt fibers as you sweep the weight up and out.","muscle":"Delts","yt":"https://youtu.be/fjiOCmFljDM","sub1yt":"https://youtu.be/64RFJSCJuN8","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Upper #1","name":"Lat-Focused Cable Row","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Half-Kneeling 1-Arm Lat Pulldown","sub2":"Elbows-In 1-Arm DB Row","notes":"Keep your torso locked in a fixed position (don't lean forward on the negative). Drive your elbows down and back to engage the lats. Keep your elbows tucked in to your sides.","muscle":"Back","yt":"https://youtu.be/w11Kqjm-ycE","sub1yt":"https://youtu.be/r8K1Fkch5go","sub2yt":"https://youtu.be/SwloMZs8ZVk"},{"day":"Upper #1","name":"Low Incline DB Press","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Low Incline Machine Press","sub2":"Low Incline Barbell Press","notes":"Set the bench at a ~15\u00b0 incline. Do a slight elbow tuck on the negative and then flare as you push (assuming this doesn't bother your shoulders). Nice, smooth reps here. No pausing at the top or bottom: constant tension on the pecs!","muscle":"Chest","yt":"https://youtu.be/YmlMsvNGTKA","sub1yt":"https://youtu.be/JmsY9nSqX9E","sub2yt":"https://youtu.be/_74oMsrIFXA"},{"day":"Upper #1","name":"Chest-Supported T-Bar Row + Kelso Shrug","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10 + 4-6","rest":"~2-3 min","sub1":"Machine Chest-Supported Row + Kelso Shrug","sub2":"Incline Chest-Supported DB Row + Kelso Shrug","notes":"Do 8-10 reps as a normal T-Bar row, driving your elbows back at roughly 45\u00b0 and squeezing your shoulder blades together. Without resting, do another 4-6 reps as Kelso Shrugs (just squeeze your shoulder blades together without rowing all the way back with your arms).","muscle":"Back","yt":"https://youtu.be/qsmjaYao9pA","sub1yt":"https://youtu.be/SUAafTp7WTQ","sub2yt":"https://youtu.be/IBRrEPQZUO0"},{"day":"Upper #1","name":"Bent-Over Cable Pec Flye (w/ Integrated Partials)","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Pec Deck (w/ Integrated Partials)","sub2":"DB Flye (w/ Integrated Partials)","notes":"Lean forward until your torso is parallel with the floor, flye straight out and down toward the floor. Stretch and squeeze the pecs! Stay locked in.","muscle":"Chest","yt":"https://youtu.be/DKaKmnB0BO8","sub1yt":"https://youtu.be/NPa8YvUg4CM","sub2yt":"https://youtu.be/AOsdioes78c"},{"day":"Upper #1","name":"1-Arm Lat Pull-In","b":2,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Wide-Grip Lat Pulldown","sub2":"Wide-Grip Band-Assisted Pull-Up","notes":"Pull the cable in from the side. Keep a mind-muscle connection with your lats and try to prevent your biceps from taking over. Palpate (feel) your lats with your other hand if that helps you connect with them better.","muscle":"Back","yt":"https://youtu.be/RMGuHVQKOms","sub1yt":"https://youtu.be/IYXRrYXfVLc","sub2yt":"https://youtu.be/6LGHiZ5iZbE"},{"day":"Upper #1","name":"Dual-Cable Triceps Press","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Bar)","sub2":"DB Skull Crusher","notes":"Hold the cables without a handle and get them into position just above your shoulders (around chin level). Press the weight forward (straight out in front of you), not up overhead like in a standard overhead triceps extension.","muscle":"Triceps","yt":"https://youtu.be/SNcQJjXWa_E","sub1yt":"https://youtu.be/9_I1PqZAjdA","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Lower #1","name":"Seated Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Lower #1","name":"Machine Hip Adduction","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Lower #1","name":"Smith Machine Squat","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-5 min","sub1":"Machine Squat","sub2":"DB Bulgarian Split Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/wSHxfQJe1ic","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/Z1uu0uHYl20"},{"day":"Lower #1","name":"Leg Extension","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Lower #1","name":"DB Calf Jumps","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Leg Press Calf Jumps","sub2":"Standing Calf Raise","notes":"Hold a dumbbell and perform a jumping motion without actually leaving the floor, using a slight knee bend, but mostly relying on your calves/ankles to drive the \"jump\". I believe I built a lot of calf mass by doing jump rope; these are meant to provide a similar stimulus, but with more tension.","muscle":"Calves","yt":"https://youtu.be/JkY3nBTbRac","sub1yt":"https://youtu.be/FKY1GmU-nYI","sub2yt":"https://youtu.be/WMkCGNwo5ts"},{"day":"Upper #2","name":"Dual-Handle Lat Pulldown (Mid-back + Lats)","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhand Lat Pulldown","sub2":"Pull-Up","notes":"Lean back by ~15\u00b0 and drive your elbows down as you squeeze your shoulder blades together. This should feel like a mix of lats and mid-traps.","muscle":"Back","yt":"https://youtu.be/NwQ5Ch5t5Vk","sub1yt":"https://youtu.be/IAktPXPhWYQ","sub2yt":"https://youtu.be/5h_NehuTqe4"},{"day":"Upper #2","name":"Seated DB Shoulder Press","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Seated Barbell Shoulder Press","sub2":"Standing DB Arnold Press","notes":"Slightly rotate the dumbbells in on the negative and flare your elbows out as you push.","muscle":"Delts","yt":"https://youtu.be/B8PB5RPhTWQ","sub1yt":"https://youtu.be/rRpQJAJZgiI","sub2yt":"https://youtu.be/xBJBTfPcvhM"},{"day":"Upper #2","name":"Chest-Supported Machine Row","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Chest-Supported T-Bar Row","sub2":"Helms Row","notes":"Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","muscle":"Back","yt":"https://youtu.be/QZ7VZpjNTG8","sub1yt":"https://youtu.be/-FAxUZoPDc4","sub2yt":"https://youtu.be/DjO2G9DIerQ"},{"day":"Upper #2","name":"Decline Machine Chest Press","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Decline Smith Machine Press","sub2":"Decline Barbell Press","notes":"Feel your pecs stretching apart on the negative. Mind-muscle connection with lower pecs.","muscle":"Chest","yt":"https://youtu.be/AABuMGK9H28","sub1yt":"https://youtu.be/MlqHZEhBGtw","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Upper #2","name":"Concentration Cable Curl","b":2,"sup":"","warmup":"1","sets":"2","reps":"10-12","rest":"~1-2 min","sub1":"DB Concentration Curl","sub2":"DB Preacher Curl","notes":"Place your working elbow against your knee and perform strict form curls.","muscle":"Biceps","yt":"https://youtu.be/BFZyW_7ld0c","sub1yt":"https://youtu.be/Oq7gJuAuJh0","sub2yt":"https://youtu.be/EWOxgi81xFA"},{"day":"Upper #2","name":"Cross-Body Cable Y-Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Machine Lateral Raise","sub2":"DB Lateral Raise","notes":"Think about \"drawing a sword\" as you do the positive. Sweep your arm up, out and across your body. It may take a few weeks to get used to these if you haven't done them before, but once they click, they really click.","muscle":"Delts","yt":"https://youtu.be/64RFJSCJuN8","sub1yt":"https://youtu.be/nc6pAci8Tpg","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Upper #2","name":"Rear Delt 45\u00b0 Cable Flye","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"DB Rear Delt Swing","sub2":"Bent-Over Reverse DB Flye","notes":"Pull with one arm at a time, bracing with your non-working hand against the machine. Try to align your arm and the cable in a straight line at the bottom of the flye.","muscle":"Delts","yt":"https://youtu.be/8iXorduqXC8","sub1yt":"https://youtu.be/1D4r_xpln88","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Lower #2","name":"Lying Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~1-2 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl. Once you can't get to the full squeeze, continue with partial reps on the last set.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Lower #2","name":"Smith Machine Reverse Lunge","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"8","rest":"~1-2 min","sub1":"DB Reverse Lunge","sub2":"DB Walking Lunge","notes":"Set one leg back on the negative and then drive the weight up using your front leg. Try to minimize assistance from your back leg.","muscle":"Quads","yt":"https://youtu.be/D0KZo_gBsw0","sub1yt":"https://youtu.be/QSGe2Sd8kUI","sub2yt":"https://youtu.be/BC_eDtrB-M4"},{"day":"Lower #2","name":"Glute-Ham Raise","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"8","rest":"~3-4 min","sub1":"Nordic Ham Curl","sub2":"Seated Leg Curl","notes":"Cut out the top ~25% of the ROM, where there will be minimal tension on the hamstrings. Control the negative and squeeze your hamstrings to pull yourself up!","muscle":"Hamstrings","yt":"https://youtu.be/9ksG-O0ZUto","sub1yt":"https://youtu.be/UbNb5Tsl46c","sub2yt":"https://youtu.be/oWJBLChYZOQ"},{"day":"Lower #2","name":"Machine Hip Adduction","b":2,"sup":"A1","warmup":"1","sets":"3","reps":"10-12","rest":"N/A","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Lower #2","name":"Machine Hip Abduction","b":2,"sup":"A2","warmup":"1","sets":"3","reps":"10-12","rest":"N/A","sub1":"Cable Hip Abduction","sub2":"Lateral Band Walk","notes":"If possible, use pads to increase the range of motion on the machine. Lean forward and grab onto the machine rails to stretch the glutes further.","muscle":"Glutes","yt":"https://youtu.be/iGd7fQffkkM","sub1yt":"https://youtu.be/uqF4qttYpN8","sub2yt":"https://youtu.be/sOYvvFPYdsU"},{"day":"Lower #2","name":"Standing Calf Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Seated Calf Raise","sub2":"Leg Press Calf Press","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/WMkCGNwo5ts","sub1yt":"https://youtu.be/6pfj0G7VKdM","sub2yt":"https://youtu.be/-mcxziH_KdM"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 1","b":2,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 2 (optional)","b":2,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Slow-Eccentric EZ-Bar Skull Crusher","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Skull Crusher","sub2":"Slow-Eccentric DB French Press","notes":"Use a 3-4 second negative. Arc the EZ-bar slightly back behind your head. When you extend, keep the bar back behind your eye line. Use the inside (closer) grip option and allow the elbows to flare to a degree that feels comfortable.","muscle":"Triceps","yt":"https://youtu.be/opVMIWzaNFY","sub1yt":"https://youtu.be/HpW1nqPsGvw","sub2yt":"https://youtu.be/EAW6XDAlZPo"},{"day":"Arms & Weak Points","name":"Slow-Eccentric Bayesian Curl","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Incline Curl","sub2":"Slow-Eccentric DB Scott Curl","notes":"Use a 3-4 second negative and a slight pause at the bottom of each rep to emphasize stretching your biceps.","muscle":"Biceps","yt":"https://youtu.be/Kf2kXBoIgM0","sub1yt":"https://youtu.be/_ceLw3Q6uTA","sub2yt":"https://youtu.be/ijgSR2yriyg"},{"day":"Arms & Weak Points","name":"Triceps Diverging Pressdown (Long Rope or 2 Ropes)","b":2,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Cable Triceps Kickback","sub2":"DB Triceps Kickback","notes":"Use two long ropes or one long rope. Lean slightly forward, flare your elbows slightly out and keep your arms back in line with your torso. Then do triceps pressdowns, getting a full, big squeeze at the bottom.","muscle":"Triceps","yt":"https://youtu.be/20tbMlP71Nc","sub1yt":"https://youtu.be/FGJ64JyKod0","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points","name":"Reverse-Grip Cable Curl","b":2,"sup":"","warmup":"0","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Reverse-Grip EZ-Bar Curl","sub2":"Reverse-Grip DB Curl","notes":"Grab a cable bar with your palms facing down and perform curls. These will work the back of your forearm, brachialis and biceps!","muscle":"Biceps","yt":"https://youtu.be/xtZvYrfw2Is","sub1yt":"https://youtu.be/IZNaQzWXgwA","sub2yt":"https://youtu.be/KYfVrzmh-GU"},{"day":"Arms & Weak Points","name":"Roman Chair Leg Raise","b":2,"sup":"","warmup":"0","sets":"3","reps":"10-20","rest":"~1-2 min","sub1":"Hanging Leg Raise","sub2":"Reverse Crunch","notes":"Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit RPE 9-10 (0-1 reps shy of failure) with controlled form.","muscle":"Abs","yt":"https://youtu.be/irOzFVqJ0IE","sub1yt":"https://youtu.be/rGqwkinWqYI","sub2yt":"https://youtu.be/fYZmIC9_sx4"}],"weekVars":{"1":[[0,"0-1","0","Myo-reps"],[1,"1","0","Long-length Partials (on all reps of the last set)"],[2,"1-2","0-1","Pec Static Stretch (30 sec hold)"],[3,"1","0","Long-length Partials (on all reps of the last set)"],[4,"0-1","0","Dropse
