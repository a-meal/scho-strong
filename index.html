function setBwMode(i,on){
  if(on===isBw(i)) return;
  if(on){
    var hist=WEEKS.filter(function(w){ var e=E(w,i); return e.s1&&n(e.s1.load)!==null; });
    if(hist.length&&confirm("You have "+hist.length+" week(s) logged here.\n\nOK: those numbers were TOTAL weight including your body, convert them to added weight.\n\nCancel: those numbers were already just the added weight.")){
      hist.forEach(function(w){
        var e=E(w,i),b=sessionBw(w,i); if(b===null) return;
        var patch={bw:String(b)};
        slotsAll.forEach(function(s){
          if(e[s]&&n(e[s].load)!==null){
            var cur={}; for(var q in e[s]) cur[q]=e[s][q];
            cur.load=String(Math.round((n(e[s].load)-b)*10)/10);
            patch[s]=cur;
          }
        });
        setE(w,i,patch);
      });
    }
  }
  if(on) S.bwEx[i]=1; else delete S.bwEx[i];
  flush(); if(S.view!=="day"||sheet.hidden) render(true); else render(true);
}

function swapSlots(w,a,b){

function move(dir){
  var w=S.week,d=S.day+dir,C=calFor(w);
  while(d>=0&&d<CYCLE&&C[d]==="Rest") d+=dir;
  if(d<0){ if(w>1){ w--; C=calFor(w); d=CYCLE-1; while(d>0&&C[d]==="Rest") d--; } else d=S.day; }
  if(d>=CYCLE){ if(w<PG.weeks){ w++; C=calFor(w); d=0; while(d<CYCLE-1&&C[d]==="Rest") d++; } else d=S.day; }
  S.week=w; S.day=d; S.open={}; render();
}

}

/* ===================== NUTRITION ===================== */
var KPL=3500, KPKG=7700;
var ACT=[[1.2,"Desk job, little else"],[1.375,"Light activity most days"],[1.55,"On your feet a lot"],[1.725,"Hard physical job"]];
function kcalPerUnit(){ return S.unit==="kg"?KPKG:KPL; }
function nutDefaults(){
  return {on:0,sex:"m",age:"",ht:"",act:1.375,goal:"maintain",rate:0.5,protPerLb:1,fatPerLb:.35,
          tdee:null,seed:null,targets:null,lastCalc:"",history:[]};
}
function N(){ if(!S.nutri) S.nutri=nutDefaults(); return S.nutri; }
function foodDay(ds){ return (S.food&&S.food[ds])?S.food[ds]:[]; }
function dayTotals(ds,meal){
  var t={kcal:0,p:0,f:0,c:0,fi:0,su:0,so:0,sf:0,k:0};
  foodDay(ds).forEach(function(e){
    if(meal&&(e.m||"Snacks")!==meal) return;
    t.kcal+=+e.kcal||0; t.p+=+e.p||0; t.f+=+e.f||0; t.c+=+e.c||0;
    MIC.forEach(function(m){ t[m[0]]+=+e[m[0]]||0; });
  });
  return t;
}
/* smoothed weight trend, one value per day, gaps carried forward */
function trendSeries(){
  var k=bwKeys(); if(!k.length) return {};
  var out={},prev=null,alpha=.2;
  var d0=new Date(k[0]+"T00:00:00"),d1=new Date(k[k.length-1]+"T00:00:00");
  for(var t=d0.getTime();t<=d1.getTime();t+=86400000){
    var ds=iso(new Date(t)),raw=n(S.bw[ds]);
    if(raw===null){ if(prev!==null) out[ds]=prev; continue; }
    prev=prev===null?raw:prev+alpha*(raw-prev);
    out[ds]=prev;
  }
  return out;
}
function mifflin(){
  var nu=N(),bwv=latestBw(),age=n(nu.age),ht=n(nu.ht);
  if(bwv===null||age===null||ht===null) return null;
  var kg=S.unit==="kg"?bwv:bwv*.4536, cm=ht*2.54;
  var bmr=10*kg+6.25*cm-5*age+(nu.sex==="f"?-161:5);
  return {bmr:bmr,tdee:bmr*nu.act};
}
/* measured burn: average intake minus what the scale actually did */
function measuredTdee(){
  var tr=trendSeries(),days=Object.keys(S.food||{}).filter(function(d){ return dayTotals(d).kcal>0; }).sort();
  if(days.length<10) return null;
  var win=days.slice(-21);
  var a=win[0],b=win[win.length-1];
  if(!tr[a]||!tr[b]) return null;
  var span=Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000);
  if(span<9) return null;
  var logged=win.filter(function(d){ return d>=a&&d<=b; });
  if(logged.length<span*.7) return null;
  var avg=logged.reduce(function(x,d){ return x+dayTotals(d).kcal; },0)/logged.length;
  var delta=tr[b]-tr[a];
  return {tdee:avg-(delta*kcalPerUnit())/span,days:span,logged:logged.length,avg:avg,delta:delta};
}
function currentTdee(){
  var m=measuredTdee();
  if(m) return {v:m.tdee,src:"measured",info:m};
  var f=mifflin();
  if(f) return {v:f.tdee,src:"estimated",info:f};
  return null;
}
function buildTargets(tdee){
  var nu=N(),bwv=latestBw();
  if(bwv===null) return null;
  var lb=S.unit==="kg"?bwv*2.2046:bwv;
  var shift=nu.goal==="maintain"?0:(nu.rate*kcalPerUnit()/7)*(nu.goal==="cut"?-1:1);
  var kcal=tdee+shift;
  var f=mifflin();
  var floor=f?Math.max(f.bmr*1.05,1200):1200;
  if(kcal<floor) kcal=floor;
  if(kcal<tdee*.75) kcal=tdee*.75;
  var p=lb*nu.protPerLb, fat=lb*nu.fatPerLb;
  var c=(kcal-p*4-fat*9)/4;
  if(c<50){ fat=Math.max(lb*.25,(kcal-p*4-50*4)/9); c=(kcal-p*4-fat*9)/4; }
  return {kcal:Math.round(kcal),p:Math.round(p),f:Math.round(fat),c:Math.round(Math.max(0,c))};
}
function recalcTargets(force){
  var nu=N(),t=currentTdee();
  if(!t) return false;
  var prev=nu.tdee;
  var blended=(prev&&t.src==="measured")?prev*.5+t.v*.5:t.v;
  var tg=buildTargets(blended);
  if(!tg) return false;
  nu.tdee=blended; nu.targets=tg; nu.lastCalc=today(); nu.src=t.src;
  nu.history.unshift({d:today(),tdee:Math.round(blended),kcal:tg.kcal,p:tg.p,f:tg.f,c:tg.c,src:t.src});
  nu.history=nu.history.slice(0,12);
  save(); return true;
}
function dueForRecalc(){
  var nu=N();
  if(!nu.on) return false;
  if(!nu.lastCalc||!nu.targets) return true;
  return (new Date(today()+"T00:00:00")-new Date(nu.lastCalc+"T00:00:00"))/86400000>=7;
}

function per100From(nut){
  var kc=n(nut["energy-kcal_100g"]);
  if(kc===null&&n(nut["energy_100g"])!==null) kc=n(nut["energy_100g"])/4.184;
  var sod=n(nut.sodium_100g);
  if(sod===null&&n(nut.salt_100g)!==null) sod=n(nut.salt_100g)*0.393;
  return {kcal:kc,p:n(nut.proteins_100g),f:n(nut.fat_100g),c:n(nut.carbohydrates_100g),
          fi:n(nut.fiber_100g)||0,su:n(nut.sugars_100g)||0,
          so:sod===null?0:sod*1000, sf:n(nut["saturated-fat_100g"])||0,

function portionSheet(){

     (f.servG?'<option value="s">servings ('+fmt(f.servG,0)+'g)</option>':'')+'</select></div>';

  function calc(){
    var a=n(amt.value)||0, g=un.value==="s"?a*(f.servG||100):a;
    var k=g/100;
    var r={g:g,kcal:(f.kcal||0)*k,p:(f.p||0)*k,ff:(f.f||0)*k,c:(f.c||0)*k,label:un.value==="s"?a+" serving"+(a===1?"":"s"):Math.round(g)+"g"};
    MIC.forEach(function(m){ r[m[0]]=(f[m[0]]||0)*k; });
    return r;
  }
  function draw(){
    var r=calc();
    pv.innerHTML='<div class="pk">'+Math.round(r.kcal)+' <span>kcal</span></div><div class="pm">'+
      Math.round(r.p)+'g protein \u00b7 '+Math.round(r.ff)+'g fat \u00b7 '+Math.round(r.c)+'g carbs</div>';
  }
  amt.oninput=draw; un.onchange=draw; draw();
  document.getElementById("pcancel").onclick=function(){ pending=null; closeSheet(); };
  document.getElementById("padd").onclick=function(){
    var r=calc();

    MIC.forEach(function(m){ ent[m[0]]=Math.round(r[m[0]]*10)/10; });

    addEntry(ent);

    MIC.forEach(function(m){ keep[m[0]]=f[m[0]]||0; });

function doSearch(q){
  q=(q||"").trim(); if(!q) return;
  searchSheet(q,null,"loading");
  var url=OFF+"/cgi/search.pl?search_terms="+encodeURIComponent(q)+"&search_simple=1&action=process&json=1&page_size=24&fields=product_name,brands,nutriments,serving_quantity";
  fetch(url).then(function(r){ return r.json(); }).then(function(d){
    var out=[];
    (d.products||[]).forEach(function(p){
      var m=per100From(p.nutriments||{});
      if(!p.product_name||m.kcal===null) return;
      var it={n:p.product_name,brand:(p.brands||"").split(",")[0],kcal:m.kcal,p:m.p||0,f:m.f||0,c:m.c||0,servG:n(p.serving_quantity)||0};
      MIC.forEach(function(x){ it[x[0]]=m[x[0]]||0; });
      out.push(it);
    });
    searchSheet(q,out,out.length?"ok":"none");
  }).catch(function(){ searchSheet(q,null,"error"); });
}
function lookupBarcode(code){
  scanSheet("looking");
  fetch(OFF+"/api/v2/product/"+encodeURIComponent(code)+"?fields=product_name,brands,nutriments,serving_quantity")
   .then(function(r){ return r.json(); })
   .then(function(d){
     if(!d.product||!d.product.product_name) return scanSheet("missing",code);
     var m=per100From(d.product.nutriments||{});
     if(m.kcal===null) return scanSheet("missing",code);
     var it={n:d.product.product_name,brand:(d.product.brands||"").split(",")[0],kcal:m.kcal,p:m.p||0,f:m.f||0,c:m.c||0,servG:n(d.product.serving_quantity)||0,code:code};
     MIC.forEach(function(x){ it[x[0]]=m[x[0]]||0; });
     openPortion(it);
   }).catch(function(){ scanSheet("error",code); });
}
var scanner=null;
function stopScan(){ try{ if(scanner){ scanner.stop(); scanner.clear(); } }catch(e){} scanner=null; }
function scanSheet(state,code){
  var h='<h3>Scan a barcode</h3>';
  if(state==="looking") h+='<p class="empty">Looking it up\u2026</p>';
  else if(state==="missing") h+='<p class="empty">Barcode '+esc(code||"")+' is not in the database. Use Quick add and type the numbers off the label. It will be saved for next time.</p>';
  else if(state==="error") h+='<p class="empty">Could not reach the food database. Check your signal.</p>';
  else if(state==="noscan") h+='<p class="empty">The scanner could not start. Either the camera was blocked or the page has no signal. Type the barcode below instead.</p>';
  else h+='<div id="cam" class="cam"></div><p class="sub" style="color:var(--mut);margin:10px 0 0">Hold the barcode steady in the frame.</p>';
  h+='<div class="prow" style="margin-top:12px"><input id="bcode" inputmode="numeric" placeholder="or type the barcode"><button class="btn amber" id="bgo">Look up</button></div>';
  h+='<button class="btn wide" id="sclose" style="margin-top:12px">Close</button>';
  sheetBox.innerHTML=h;
  document.getElementById("sclose").onclick=function(){ stopScan(); closeSheet(); };
  document.getElementById("bgo").onclick=function(){
    var v=document.getElementById("bcode").value.trim();
    if(v){ stopScan(); lookupBarcode(v); }
  };
  if(!state) startScan();
}
function startScan(){
  var go=function(){
    if(!window.Html5Qrcode) return scanSheet("noscan");
    try{
      scanner=new window.Html5Qrcode("cam",{verbose:false});
      scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:140}},
        function(txt){ stopScan(); lookupBarcode(txt); },
        function(){}
      ).catch(function(){ scanSheet("noscan"); });
    }catch(e){ scanSheet("noscan"); }
  };
  if(window.Html5Qrcode) return go();
  var sc=document.createElement("script");
  sc.src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js";
  sc.onload=go; sc.onerror=function(){ scanSheet("noscan"); };
  document.head.appendChild(sc);
}

var TON=[[5000,"a pickup truck"],[10000,"an African elephant"],[25000,"a school bus"],
[50000,"a loaded dump truck"],[100000,"an empty Boeing 737"],[250000,"a loaded 757 at takeoff"],
[500000,"the Statue of Liberty"],[1000000,"a fully loaded 747"],[2000000,"two fully loaded 747s"],
[5000000,"the Space Shuttle at liftoff"]];
/* totals span every program; bodyweight and food are global already */
function allProgs(){
  packActive();
  return Object.keys(S.P).map(function(id){ return {id:id,p:S.P[id],prog:PROGRAMS[id]}; }).filter(function(x){ return x.prog; });
}
function lifetime(){
  var out={tons:0,sessions:0,prs:0,onTarget:0,clean:0,best:0};
  allProgs().forEach(function(x){
    var P2=x.prog,log=x.p.log||{},fin=x.p.fin||{},cat=P2.catalog;
    var nSets=function(i){ return parseInt(cat[i].sets,10)||2; };
    var sl=function(i){ var o=[],k=nSets(i); for(var q=1;q<=k;q++) o.push("s"+q); return o; };
    var vr=function(w,i){
      var rows=P2.weekVars[String(w)]; if(!rows) return null;
      if(P2.indexed){ for(var k=0;k<rows.length;k++) if(rows[k][0]===i) return [rows[k][1],rows[k][2]]; return null; }
      return rows[i]||null;
    };
    for(var k in fin) if(fin[k]) out.sessions++;
    cat.forEach(function(c,i){
      var best=null;
      for(var w=1;w<=P2.weeks;w++){
        var e=log[w+":"+i]; if(!e) continue;
        var top=null,q=null;
        sl(i).forEach(function(s,si){
          if(!e[s]) return;
          var L=parseFloat(e[s].load),R=parseFloat(e[s].reps);
          if(!isNaN(L)&&!isNaN(R)){ out.tons+=L*R; if(L>out.best) out.best=L; var v=L*(1+R/30); if(q===null||v>q) q=v; }
          var tv=vr(w,i);
          if(tv&&e[s].rir!==undefined&&e[s].rir!==""){
            var tgt=(nSets(i)===1||si<nSets(i)-1)?tv[0]:tv[1];
            var a=effNum(e[s].rir),t2=effNum(tgt);
            if(a!==null&&t2!==null&&Math.abs(a-t2)<0.26) out.onTarget++;
          }
        });
        if(q!==null){ if(best!==null&&q>best+0.5) out.prs++; if(best===null||q>best) best=q; }
      }
    });
  });
  return out;
}
function cleanDays(){
  var n2=0;
  allProgs().forEach(function(x){
    var P2=x.prog,log=x.p.log||{},fin=x.p.fin||{};
    var byD={};
    P2.catalog.forEach(function(c,i){ (byD[c.day]=byD[c.day]||[]).push(i); });
    for(var k in fin){
      if(!fin[k]) continue;
      var parts=k.split("|"),w=+parts[0],di=+parts[1];
      var pat=(x.p.weekPattern&&x.p.weekPattern[String(w)])||x.p.pattern||P2.pattern;
      var dn=pat[di]; if(!dn||dn==="Rest") continue;
      var blk=w<=P2.blockSplit?1:2;
      var ids=(byD[dn]||[]).filter(function(i){ return !P2.catalog[i].b||P2.catalog[i].b===blk; });
      if(ids.length&&ids.every(function(i){ var e=log[w+":"+i]; return e&&!e.skipped; })) n2++;
    }
  });
  return n2;
}
function perfectWeeks(){
  var pw=0,pb=0,done=0;
  allProgs().forEach(function(x){
    var P2=x.prog,fin=x.p.fin||{};
    var pat=x.p.pattern||P2.pattern;
    var train=pat.filter(function(d){ return d!=="Rest"; }).length;
    var byW={};
    for(var k in fin){ if(fin[k]) byW[k.split("|")[0]]=(byW[k.split("|")[0]]||0)+1; }
    var full=0;
    for(var w=1;w<=P2.weeks;w++) if((byW[w]||0)>=train){ pw++; full++; }
    var b1=true,b2=true,all=true;
    for(var w2=1;w2<=P2.weeks;w2++){
      var ok=(byW[w2]||0)>=train;
      if(!ok){ all=false; if(w2<=P2.blockSplit) b1=false; else b2=false; }
    }
    if(b1) pb++;
    if(b2) pb++;
    if(all) done++;
  });
  return {weeks:pw,blocks:pb,programs:done};
}
function streakBest(){
  var best=0;
  allProgs().forEach(function(x){
    var P2=x.prog,fin=x.p.fin||{};
    var pat=x.p.pattern||P2.pattern,run=0;
    for(var w=1;w<=P2.weeks;w++){
      for(var di=0;di<pat.length;di++){
        if(pat[di]==="Rest") continue;
        if(fin[w+"|"+di]){ run++; if(run>best) best=run; } else run=0;
      }
    }
  });
  return best;
}
function bwRatioHits(){
  var one=false,two=false,bwv=latestBw();
  if(bwv===null) return {one:false,two:false};
  allProgs().forEach(function(x){
    var P2=x.prog,log=x.p.log||{};
    P2.catalog.forEach(function(c,i){
      for(var w=1;w<=P2.weeks;w++){
        var e=log[w+":"+i]; if(!e) continue;
        ["s1","s2","s3","s4"].forEach(function(s){
          if(!e[s]) return;
          var L=parseFloat(e[s].load);
          if(isNaN(L)) return;
          if(L>=bwv) one=true;
          if(L>=bwv*2) two=true;
        });
      }
    });
  });
  return {one:one,two:two};
}
function fullPictureDays(){
  var days={};
  allProgs().forEach(function(x){
    var P2=x.prog,fin=x.p.fin||{},st=x.p.start;
    if(!st) return;
    var pat=x.p.pattern||P2.pattern;
    for(var k in fin){
      if(!fin[k]) continue;
      var pr=k.split("|"),w=+pr[0],di=+pr[1];
      var dt=new Date(new Date(st+"T00:00:00").getTime()+((w-1)*pat.length+di)*86400000);
      days[iso(dt)]=1;
    }
  });
  var n2=0;
  for(var d in days){ if(S.bw[d]!==undefined&&S.food&&S.food[d]&&S.food[d].length) n2++; }
  return n2;
}
function badgeList(){

  var foodDays=Object.keys(S.food||{}).filter(function(d){ return S.food[d].length; }).length;

  var fp=fullPictureDays();
  var B=[

   ["crown","Hundred down","100 workouts finished",L.sessions,100],
   ["link","Unbroken","10 scheduled sessions in a row",str,10],

   ["trending-up","Ten PRs","Beat your own best 10 times",L.prs,10],
   ["rocket","Twenty-five PRs","Beat your own best 25 times",L.prs,25],
   ["barbell","Bodyweight club","A working set at or above your bodyweight",bwr.one?1:0,1],
   ["flame-off","Double bodyweight","A working set at twice your bodyweight",bwr.two?1:0,1],
   ["scale","Weighed in","Bodyweight logged on 30 days",bwDays,30],
   ["salad","Fed and logged","Food logged on 30 days",foodDays,30],
   ["eye","Full picture","10 days with workout, weight and food all logged",fp,10],
   ["flag","Program complete","Finish every session in a program",pw.programs,1]
  ];
  var SCOPE={
   "Perfect week":"One program at a time. Switching programs keeps what you have already earned.",
   "Perfect block":"One program at a time. Switching programs keeps what you have already earned.",
   "Program complete":"One program at a time. Switching programs keeps what you have already earned.",
   "Fed and logged":"Food is shared across every program and never resets.",
   "Weighed in":"Bodyweight is shared across every program and never resets.",
   "Full picture":"Counts days where all three were logged. Needs a start date set."
  };
  return B.map(function(b){
    return {icon:b[0],name:b[1],how:b[2],have:Math.min(b[3],b[4]),need:b[4],done:b[3]>=b[4],
            scope:SCOPE[b[1]]||"Counted across every program you have trained."};
  });
}
function tonMark(t){
  for(var i=0;i<TON.length;i++) if(t<TON[i][0]) return {next:TON[i],prev:i?TON[i-1]:null,idx:i};
  return {next:null,prev:TON[TON.length-1],idx:TON.length};
}
/* a vertical gauge, log-scaled so every marker fits on one column */
function tonPos(t){
  var lo=TON[0][0], hi=TON[TON.length-1][0];
  if(t<=0) return 0;
  var p=Math.log(t/lo)/Math.log(hi/lo);
  return Math.max(0,Math.min(1,p));
}
function epicSVG(t){
  var H=300,W=250,top=16,bot=282,span=bot-top;
  var y=function(p){ return bot-p*span; };
  var fill=y(tonPos(t));
  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:300px" role="img"><title>Weight lifted against the milestone ladder</title>';
  g+='<defs><linearGradient id="gx" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color=TC.accFill/><stop offset="1" stop-color=TC.acc/></linearGradient></defs>';
  g+='<rect x="30" y="'+top+'" width="34" height="'+span+'" rx="6" fill="'+TC.neutral+'" stroke="'+TC.line+'"/>';
  if(t>0){
    g+='<rect x="30" y="'+fill.toFixed(1)+'" width="34" height="'+(bot-fill).toFixed(1)+'" rx="6" fill="url(#gx)"/>';
    g+='<rect x="24" y="'+(fill-2).toFixed(1)+'" width="46" height="4" rx="2" fill="'+TC.txt+'"/>';
  }
  for(var k=0;k<TON.length;k++){
    var p=tonPos(TON[k][0]), yy=y(p), hit=t>=TON[k][0];
    g+='<line x1="30" y1="'+yy.toFixed(1)+'" x2="64" y2="'+yy.toFixed(1)+'" stroke="'+(hit?TC.accOn:TC.line)+'" stroke-width="1"/>';
    g+='<line x1="64" y1="'+yy.toFixed(1)+'" x2="76" y2="'+yy.toFixed(1)+'" stroke="'+(hit?TC.acc:TC.line)+'" stroke-width="1"/>';
    g+='<text x="82" y="'+(yy+3.5).toFixed(1)+'" fill="'+(hit?TC.txt:TC.dim)+'" font-size="10" font-family="Azeret Mono, monospace">'+short(TON[k][0])+'</text>';
    g+='<text x="126" y="'+(yy+3.5).toFixed(1)+'" fill="'+(hit?TC.mut:TC.ghost)+'" font-size="10" font-family="Archivo, sans-serif">'+esc(TON[k][1])+'</text>';
  }
  return g+'</svg>';
}
var CMP=[
 [2900,"Honda Civics","You do not own that many."],
 [1200,"grand pianos","None of them in tune."],

function compareLine(t){
  if(t<=0) return "";
  var bwv=latestBw(),idx=S.cmpIdx||0;
  if(bwv&&idx===0) return "That is you, lifted "+Math.round(t/bwv).toLocaleString()+" times over.";
  var c=CMP[(idx-(bwv?1:0)+CMP.length*2)%CMP.length];
  var n2=Math.round(t/c[0]);
  if(n2<1) return "";
  return n2.toLocaleString()+" "+c[1]+"."+(c[2]?" "+c[2]:"");
}
