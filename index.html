ame":"Chest-Supported Machine Row","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Chest-Supported T-Bar Row","sub2":"Helms Row","notes":"Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","muscle":"Back","yt":"https://youtu.be/QZ7VZpjNTG8","sub1yt":"https://youtu.be/-FAxUZoPDc4","sub2yt":"https://youtu.be/DjO2G9DIerQ"},{"day":"Full Body #2","name":"Hammer Preacher Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Fat-Grip Preacher Curl","sub2":"Hammer Curl","notes":"These will target the brachialis and forearms hard. Squeeze the dumbbell hard in the middle of the handle and curl about 3/4 of the way up (i.e. stay in the bottom 3/4 of the curl).","muscle":"Biceps","yt":"https://youtu.be/dEdnC3ca-Yg","sub1yt":"https://youtu.be/Xx6iqyRM5Mk","sub2yt":"https://youtu.be/xY3sQXYhk7A"},{"day":"Full Body #2","name":"Cuffed Behind-The-Back Lateral Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cross-Body Cable Y-Raise","sub2":"DB Lateral Raise","notes":"Raise the cables up and out in a \"Y\" motion. Really try to connect with the middle delt fibers as you sweep the weight up and out.","muscle":"Delts","yt":"https://youtu.be/fjiOCmFljDM","sub1yt":"https://youtu.be/64RFJSCJuN8","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Full Body #2","name":"Overhead Cable Triceps Extension (Bar)","b":1,"sup":"","warmup":"1","sets":"2","reps":"8-10","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Rope)","sub2":"DB Skull Crusher","notes":"Feel a nasty stretch on the triceps throughout the entire negative. Pause for 1 second in the stretch part of each rep.","muscle":"Triceps","yt":"https://youtu.be/9_I1PqZAjdA","sub1yt":"https://youtu.be/GYoUoVNlbGc","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Full Body #3","name":"Assisted Pull-Up","b":1,"sup":"A1","warmup":"1-2","sets":"4","reps":"8-10","rest":"~1 min","sub1":"Lat Pulldown","sub2":"Machine Pulldown","notes":"Slow 2-3 second negative. Feel your lats pulling apart on the way down. Slight 0.5-1 second pause at the bottom, then lift your chest up and drive your elbows down as you lift yourself up. Don't be afraid to use assistance. Keep the form tight and controlled!","muscle":"Back","yt":"https://youtu.be/iZQNHZuvfUQ","sub1yt":"https://youtu.be/IAktPXPhWYQ","sub2yt":"https://youtu.be/kd6rshRa164"},{"day":"Full Body #3","name":"Paused Assisted Dip","b":1,"sup":"A2","warmup":"1-2","sets":"4","reps":"8-10","rest":"~1 min","sub1":"Decline Machine Chest Press","sub2":"Decline Barbell Press","notes":"Slow 2-3 second negative. 1-2 second pause at the bottom. Explode with control on the way up. Go as deep as your shoulders comfortably allow, trying to at least break a 90\u00b0 elbow angle.","muscle":"Chest","yt":"https://youtu.be/RyGOGviYWts","sub1yt":"https://youtu.be/AABuMGK9H28","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Full Body #3","name":"Seated Leg Curl","b":1,"sup":"B1","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Full Body #3","name":"Leg Extension","b":1,"sup":"B2","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Full Body #3","name":"Cable Paused Shrug-In","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Machine Shrug","sub2":"DB Shrug","notes":"Shrug up and in. Think about shrugging \"up to your ears\". 1-2 second pause in the squeeze (at the top) of each rep, then another 1-2 second pause in the stretch (at the bottom) of each rep.","muscle":"Back","yt":"https://youtu.be/Hy6f1Lz_PiA","sub1yt":"https://youtu.be/2KDc6iAcrAw","sub2yt":"https://youtu.be/moFqLlptX7Q"},{"day":"Full Body #3","name":"Roman Chair Leg Raise","b":1,"sup":"","warmup":"0","sets":"3","reps":"10-20","rest":"~1-2 min","sub1":"Hanging Leg Raise","sub2":"Reverse Crunch","notes":"Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit RPE 9-10 (0-1 reps shy of failure) with controlled form.","muscle":"Abs","yt":"https://youtu.be/irOzFVqJ0IE","sub1yt":"https://youtu.be/rGqwkinWqYI","sub2yt":"https://youtu.be/fYZmIC9_sx4"},{"day":"Full Body #4","name":"Lying Leg Curl","b":1,"sup":"","warmup":"1-2","sets":"2","reps":"8-10","rest":"~1-2 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Because we did seated hamstring work yesterday, these are mainly meant to get the knees nice and warmed up before hack squats. Don't push these too hard today, just feel the hamstrings moving the weight under control.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Full Body #4","name":"Hack Squat","b":1,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-5 min","sub1":"Machine Squat","sub2":"Front Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/TWUnnDK8rck","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/TRwhJ0TCoqI"},{"day":"Full Body #4","name":"Bent-Over Cable Pec Flye","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Pec Deck","sub2":"DB Flye","notes":"Lean forward until your torso is parallel with the floor, flye straight out and down toward the floor. Stretch and squeeze the pecs! Stay locked in.","muscle":"Chest","yt":"https://youtu.be/-7bVljkNWAs","sub1yt":"https://youtu.be/xei-JEpfAS4","sub2yt":"https://youtu.be/RnGCu_t0B3w"},{"day":"Full Body #4","name":"Neutral-Grip Lat Pulldown","b":1,"sup":"","warmup":"1-2","sets":"2","reps":"12-15","rest":"~2-3 min","sub1":"Neutral-Grip Pull-Up","sub2":"Machine Pulldown","notes":"Do these pulldowns with the handle more out in front of you, more like a cross between pullover and a pulldown. Focus on feeling your lats working more than the weight you're using.","muscle":"Back","yt":"https://youtu.be/eiFpSJiyHnA","sub1yt":"https://youtu.be/b0ypSz63UGo","sub2yt":"https://youtu.be/kd6rshRa164"},{"day":"Full Body #4","name":"Leg Press Calf Press","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Donkey Calf Raise","sub2":"Seated Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/-mcxziH_KdM","sub1yt":"https://youtu.be/LC9SO-pIXqA","sub2yt":"https://youtu.be/6pfj0G7VKdM"},{"day":"Full Body #4","name":"Cable Reverse Flye (Mechanical Dropset)","b":1,"sup":"","warmup":"0","sets":"3","reps":"5,4,3+","rest":"~1-2 min","sub1":"Reverse Pec Deck","sub2":"Bent-Over Reverse DB Flye","notes":"You'll probably want to watch the video for this one. Take ~3 big steps back from the cable machine and do your first 5 reps. After those first 5 reps, immediately (without resting) take 1 step forward and do another 4 reps. Then (without resting) take another step forward and do at least another 3 reps (or until you hit RPE 9-10).","muscle":"Delts","yt":"https://youtu.be/nN5RV1arpfM","sub1yt":"https://youtu.be/Y8fb_rtEU_4","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 1","b":1,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 2 (optional)","b":1,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Bayesian Cable Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Incline Curl","sub2":"DB Scott Curl","notes":"If you have a left-right bicep size imbalance, do these 1 arm at a time, starting with the weaker arm. Take the weaker arm to an RPE of 9-10. Then match the reps with the other arm (stop once you've matched the reps, even if the RPE is lower). If you don't have a size imbalance, do these both arms at the same time.","muscle":"Biceps","yt":"https://youtu.be/_w_Uan2dG-4","sub1yt":"https://youtu.be/KSJc8bhSjB0","sub2yt":"https://youtu.be/u00CqDeAHTE"},{"day":"Arms & Weak Points","name":"Triceps Pressdown (Bar)","b":1,"sup":"","warmup":"1","sets":"3","reps":"8","rest":"~1-2 min","sub1":"Triceps Pressdown (Rope)","sub2":"Close-Grip Assisted Dip","notes":"These are meant to be fairly heavy, which is why we're using a bar instead of a rope. Aim to add some weight week to week at the set rep target. Always keep the form tight as you overload the triceps.","muscle":"Triceps","yt":"https://youtu.be/o4eazahiXQw","sub1yt":"https://youtu.be/bCa036rGtVU","sub2yt":"https://youtu.be/mpcPTUAhfto"},{"day":"Arms & Weak Points","name":"Bottom-2/3 Constant Tension Preacher Curl","b":1,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bottom-2/3 EZ-Bar Curl","sub2":"Spider Curl","notes":"Stay in the bottom 2/3 of the curl. Don't squeeze all the way up to the top. Keep your triceps firmly pinned against the pad as you curl. No pausing at the top or bottom: constant tension on the biceps!","muscle":"Biceps","yt":"https://youtu.be/vHBedP8oeCA","sub1yt":"https://youtu.be/fXI8gN6pq1k","sub2yt":"https://youtu.be/jw9tvoGLJmo"},{"day":"Arms & Weak Points","name":"Cable Triceps Kickback","b":1,"sup":"","warmup":"0","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bench Dip","sub2":"DB Triceps Kickback","notes":"There are two ways you can do this: upright or bent over. Choose the one that feels more comfortable for you. The main thing is that when you're in the full squeeze, your shoulder should be positioned back behind your torso.","muscle":"Triceps","yt":"https://youtu.be/FGJ64JyKod0","sub1yt":"https://youtu.be/3CaIq8jZe18","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points","name":"Standing Calf Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Leg Press Calf Press","sub2":"Donkey Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/WMkCGNwo5ts","sub1yt":"https://youtu.be/-mcxziH_KdM","sub2yt":"https://youtu.be/LC9SO-pIXqA"},{"day":"Full Body #1","name":"Lat-Focused Cable Row","b":2,"sup":"","warmup":"2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Half-Kneeling 1-Arm Lat Pulldown","sub2":"Elbows-In 1-Arm DB Row","notes":"Keep your torso locked in a fixed position (don't lean forward on the negative). Drive your elbows down and back to engage the lats. Keep your elbows tucked in to your sides.","muscle":"Back","yt":"https://youtu.be/w11Kqjm-ycE","sub1yt":"https://youtu.be/r8K1Fkch5go","sub2yt":"https://youtu.be/SwloMZs8ZVk"},{"day":"Full Body #1","name":"Low Incline DB Press","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Low Incline Machine Press","sub2":"Low Incline Barbell Press","notes":"Set the bench at a ~15\u00b0 incline. Do a slight elbow tuck on the negative and then flare as you push (assuming this doesn't bother your shoulders). Nice, smooth reps here. No pausing at the top or bottom: constant tension on the pecs!","muscle":"Chest","yt":"https://youtu.be/YmlMsvNGTKA","sub1yt":"https://youtu.be/JmsY9nSqX9E","sub2yt":"https://youtu.be/_74oMsrIFXA"},{"day":"Full Body #1","name":"Lying Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"2","reps":"8-10","rest":"~2-3 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl. Once you can't get to the full squeeze, continue with partial reps on the last set.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Full Body #1","name":"Smith Machine Squat","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-4 min","sub1":"Machine Squat","sub2":"DB Bulgarian Split Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/wSHxfQJe1ic","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/Z1uu0uHYl20"},{"day":"Full Body #1","name":"Reverse Pec Deck (w/ Integrated Partials)","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-15","rest":"~1-2 min","sub1":"Reverse Cable Flye (w/ Integrated Partials)","sub2":"Bent-Over Reverse DB Flye (w/ Integrated Partials)","notes":"Sweep the weight out instead of pulling the weight back. Mind-muscle connection with rear delts. On all sets, alternate full-ROM reps and half-ROM reps (i.e. do 1 rep with full-ROM, then 1 rep half-ROM (in the stretched/bottom half), then 1 rep full-ROM, then 1 rep half-ROM). Repeat until you've reached the target reps and an RPE of 9-10.","muscle":"Delts","yt":"https://youtu.be/KDeYqB9GYeg","sub1yt":"https://youtu.be/QkAMC88WfXw","sub2yt":"https://youtu.be/eE3v36jNqDE"},{"day":"Full Body #1","name":"Cable Crunch","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Crunch","sub2":"Plate-Weighted Crunch","notes":"Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","muscle":"Abs","yt":"https://youtu.be/LvJM9V3D_CQ","sub1yt":"https://youtu.be/KlxdhDSi5Dc","sub2yt":"https://youtu.be/mP99WSRI6Bc"},{"day":"Full Body #2","name":"Cuffed Behind-The-Back Lateral Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cross-Body Cable Y-Raise","sub2":"DB Lateral Raise","notes":"Raise the cables up in a \"Y\" motion. Really try to connect with the middle delt fibers as you sweep the weight up and out.","muscle":"Delts","yt":"https://youtu.be/fjiOCmFljDM","sub1yt":"https://youtu.be/64RFJSCJuN8","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Full Body #2","name":"Chest-Supported T-Bar Row + Kelso Shrug","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10 + 4-6","rest":"~2-3 min","sub1":"Machine Chest-Supported Row + Kelso Shrug","sub2":"Incline Chest-Supported DB Row + Kelso Shrug","notes":"Do 8-10 reps as a normal T-Bar row, driving your elbows back at roughly 45\u00b0 and squeezing your shoulder blades together. Without resting, do another 4-6 reps as Kelso Shrugs (just squeeze your shoulder blades together without rowing all the way back with your arms).","muscle":"Back","yt":"https://youtu.be/qsmjaYao9pA","sub1yt":"https://youtu.be/SUAafTp7WTQ","sub2yt":"https://youtu.be/IBRrEPQZUO0"},{"day":"Full Body #2","name":"Machine Shoulder Press","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Cable Shoulder Press","sub2":"Seated DB Shoulder Press","notes":"Ensure that your elbows break at least 90\u00b0. Mind-muscle connection with your delts. Smooth, controlled reps.","muscle":"Delts","yt":"https://youtu.be/SCQVmN1gYsk","sub1yt":"https://youtu.be/OfjncdW_Vyc","sub2yt":"https://youtu.be/B8PB5RPhTWQ"},{"day":"Full Body #2","name":"Standing Calf Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Leg Press Calf Press","sub2":"Donkey Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/WMkCGNwo5ts","sub1yt":"https://youtu.be/-mcxziH_KdM","sub2yt":"https://youtu.be/LC9SO-pIXqA"},{"day":"Full Body #2","name":"Slow-Eccentric DB RDL","b":2,"sup":"","warmup":"2-3","sets":"2","reps":"8-10","rest":"~3-4 min","sub1":"Slow-Eccentric Barbell RDL","sub2":"Slow-Eccentric Glute-Ham Raise","notes":"The RPE is intentionally low here because these will cause a lot of muscle damage. Don't be tempted to go too heavy. Lower the dumbbells with a 3-4 second negative. If you want to target more glutes, squeeze them hard at the top as you get to full lockout. If you want to target more hamstrings, only go to 3/4 of full lockout and maintain constant tension on your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/9XIvGzgvoE0","sub1yt":"https://youtu.be/PeXi-Yvn6kI","sub2yt":"https://youtu.be/glfk5LBDQf0"},{"day":"Full Body #2","name":"Concentration Cable Curl","b":2,"sup":"A1","warmup":"1","sets":"2","reps":"10-12","rest":"~0.5-1 min","sub1":"DB Concentration Curl","sub2":"DB Preacher Curl","notes":"Do concentration curls on one arm, rest ~0.5-1 min, do triceps extensions for the same arm, rest ~0.5-1 min, do concentration curls on the other arm, rest ~0.5-1 min, do triceps extensions on the other arm, rest ~0.5-1 min, repeat.","muscle":"Biceps","yt":"https://youtu.be/BFZyW_7ld0c","sub1yt":"https://youtu.be/Oq7gJuAuJh0","sub2yt":"https://youtu.be/EWOxgi81xFA"},{"day":"Full Body #2","name":"Single-arm Overhead Cable Triceps Extension","b":2,"sup":"A2","warmup":"1","sets":"2","reps":"10-12","rest":"~0.5-1 min","sub1":"DB Skull Crusher","sub2":"Floor Skull Crusher","notes":"","muscle":"Triceps","yt":"https://youtu.be/eNHOA90QcAg","sub1yt":"https://youtu.be/fbLTzgTKOR8","sub2yt":"https://youtu.be/QZt9mms9o2E"},{"day":"Full Body #3","name":"Dual-Handle Lat Pulldown (Mid-back + Lats)","b":2,"sup":"","warmup":"2","sets":"4","reps":"8-10","rest":"~2-3 min","sub1":"Overhand Lat Pulldown","sub2":"Pull-Up","notes":"Lean back by ~15\u00b0 and drive your elbows down as you squeeze your shoulder blades together. This should feel like a mix of lats and mid-traps.","muscle":"Back","yt":"https://youtu.be/NwQ5Ch5t5Vk","sub1yt":"https://youtu.be/IAktPXPhWYQ","sub2yt":"https://youtu.be/5h_NehuTqe4"},{"day":"Full Body #3","name":"Decline Machine Chest Press","b":2,"sup":"","warmup":"2","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Decline Smith Machine Press","sub2":"Decline Barbell Press","notes":"Feel your pecs stretching apart on the negative. Mind-muscle connection with lower pecs.","muscle":"Chest","yt":"https://youtu.be/AABuMGK9H28","sub1yt":"https://youtu.be/MlqHZEhBGtw","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Full Body #3","name":"Machine Hip Abduction","b":2,"sup":"A1","warmup":"1","sets":"2","reps":"10-12","rest":"N/A","sub1":"Cable Hip Abduction","sub2":"Lateral Band Walk","notes":"If possible, use pads to increase the range of motion on the machine. Lean forward and grab onto the machine rails to stretch the glutes further.","muscle":"Glutes","yt":"https://youtu.be/iGd7fQffkkM","sub1yt":"https://youtu.be/uqF4qttYpN8","sub2yt":"https://youtu.be/sOYvvFPYdsU"},{"day":"Full Body #3","name":"Machine Hip Adduction","b":2,"sup":"A2","warmup":"1-2","sets":"2","reps":"10-12","rest":"~1-2 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Full Body #3","name":"Leg Extension","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Full Body #3","name":"Super-ROM DB Lateral Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~0.5-1 min","sub1":"Cable Upright Row","sub2":"DB Lateral Raise","notes":"Perform lateral raises as normal, except going until your hands are up overhead. As you break parallel, you will use more upper traps to move the weight. Feel free to squeeze your upper traps at the top. If you feel shoulder pain when going all the way up, try pointing your thumb up or simply stop at parallel and do normal lateral raises.","muscle":"Delts","yt":"https://youtu.be/nW5pGot-Hok","sub1yt":"https://youtu.be/Rm7CPzKLK1M","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Full Body #3","name":"Medicine Ball Russian Twists","b":2,"sup":"","warmup":"1","sets":"2","reps":"10-20","rest":"~1-2 min","sub1":"Half-Kneeling Pallof Press","sub2":"Bicycle Crunch","notes":"Keep the ball held out far from your body on the sides and control the reps, don't just rush through them to get the set done.","muscle":"Abs","yt":"https://youtu.be/eJF2gdt9PcE","sub1yt":"https://youtu.be/iBbvHfbKiYc","sub2yt":"https://youtu.be/OXs4DCS8Ei8"},{"day":"Full Body #4","name":"Seated Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"2","reps":"8-10","rest":"~2-3 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Full Body #4","name":"Smith Machine Reverse Lunge","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"8","rest":"~1-2 min","sub1":"DB Reverse Lunge","sub2":"DB Walking Lunge","notes":"Set one leg back on the negative and then drive the weight up using your front leg. Try to minimize assistance from your back leg.","muscle":"Quads","yt":"https://youtu.be/D0KZo_gBsw0","sub1yt":"https://youtu.be/QSGe2Sd8kUI","sub2yt":"https://youtu.be/BC_eDtrB-M4"},{"day":"Full Body #4","name":"Pec Deck (w/ Integrated Partials)","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Bent-Over Cable Pec Flye (w/ Integrated Partials)","sub2":"DB Flye (w/ Integrated Partials)","notes":"Set up the pec deck to allow for maximum stretch. On all sets, alternate full-ROM reps and half-ROM reps (i.e. do 1 rep with full-ROM, then 1 rep half-ROM (in the stretched/bottom half), then 1 rep full-ROM, then 1 rep half-ROM). Repeat until you've reached the target reps and an RPE of 9-10.","muscle":"Chest","yt":"https://youtu.be/NPa8YvUg4CM","sub1yt":"https://youtu.be/DKaKmnB0BO8","sub2yt":"https://youtu.be/AOsdioes78c"},{"day":"Full Body #4","name":"Super-ROM Overhand Cable Row","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhand Machine Row","sub2":"Arm-Out Single-Arm DB Row","notes":"Set up a wide grip pulldown bar on a seated cable row. Using a double overhand grip, perform rows while leaning forward on the negative and then extend your torso to be upright as you finish the row.","muscle":"Back","yt":"https://youtu.be/a7AH8W7dQIw","sub1yt":"https://youtu.be/WtokJfvWl-I","sub2yt":"https://youtu.be/1ydRu2K6oHg"},{"day":"Full Body #4","name":"DB Calf Jumps","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Leg Press Calf Jumps","sub2":"Standing Calf Raise","notes":"Hold a dumbbell and perform a jumping motion without actually leaving the floor, using a slight knee bend, but mostly relying on your calves/ankles to drive the \"jump\". I believe I built a lot of calf mass by doing jump rope; these are meant to provide a similar stimulus, but with more tension.","muscle":"Calves","yt":"https://youtu.be/JkY3nBTbRac","sub1yt":"https://youtu.be/FKY1GmU-nYI","sub2yt":"https://youtu.be/WMkCGNwo5ts"},{"day":"Full Body #4","name":"Rear Delt 45\u00b0 Cable Flye","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Reverse Cable Flye","sub2":"Bent-Over Reverse DB Flye","notes":"Pull with one arm at a time, bracing with your non-working hand against the machine. Try to align your arm and the cable in a straight line at the bottom of the flye.","muscle":"Delts","yt":"https://youtu.be/8iXorduqXC8","sub1yt":"https://youtu.be/zX_uPN0szeU","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 1","b":2,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Weak Point Exercise 2 (optional)","b":2,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points","name":"Slow-Eccentric EZ-Bar Skull Crusher","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Skull Crusher","sub2":"Slow-Eccentric DB French Press","notes":"Use a 3-4 second negative. Arc the EZ-bar slightly back behind your head. When you extend, keep the bar back behind your eye line. Use the inside (closer) grip option and allow the elbows to flare to a degree that feels comfortable.","muscle":"Triceps","yt":"https://youtu.be/opVMIWzaNFY","sub1yt":"https://youtu.be/HpW1nqPsGvw","sub2yt":"https://youtu.be/EAW6XDAlZPo"},{"day":"Arms & Weak Points","name":"Slow-Eccentric Bayesian Curl","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Incline Curl","sub2":"Slow-Eccentric DB Scott Curl","notes":"Use a 3-4 second negative and a slight pause at the bottom of each rep to emphasize stretching your biceps.","muscle":"Biceps","yt":"https://youtu.be/Kf2kXBoIgM0","sub1yt":"https://youtu.be/_ceLw3Q6uTA","sub2yt":"https://youtu.be/ijgSR2yriyg"},{"day":"Arms & Weak Points","name":"Triceps Diverging Pressdown (Long Rope or 2 Ropes)","b":2,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Cable Triceps Kickback","sub2":"DB Triceps Kickback","notes":"Use two long ropes or one long rope. Lean slightly forward, flare your elbows slightly out and keep your arms back in line with your torso. Then do triceps pressdowns, getting a full, big squeeze at t b1":"Rope Face Pull","sub2":"Bent-Over Reverse DB Flye","notes":"Pause for 1-2 seconds in the squeeze of each rep. Contract the rear delts hard!","muscle":"Delts","yt":"https://youtu.be/jTmI3Q1iQUk","sub1yt":"https://youtu.be/GhrVM-jPIEA","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Push #1","name":"Cuffed Behind-The-Back Lateral Raise","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cross-Body Cable Y-Raise","sub2":"DB Lateral Raise","notes":"Raise the cables up and out in a \"Y\" motion. Really try to connect with the middle delt fibers as you sweep the weight up and out.","muscle":"Delts","yt":"https://youtu.be/fjiOCmFljDM","sub1yt":"https://youtu.be/64RFJSCJuN8","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Push #1","name":"Low Incline Smith Machine Press","b":1,"sup":"","warmup":"2-3","sets":"4","reps":"8-10","rest":"~2-3 min","sub1":"Low Incline Machine Press","sub2":"Low Incline DB Press","notes":"Set the bench at a ~15\u00b0 incline. 1 second pause on the chest on each rep while maintaining tension on the pecs.","muscle":"Chest","yt":"https://youtu.be/2ITgeRy2z2s","sub1yt":"https://youtu.be/JmsY9nSqX9E","sub2yt":"https://youtu.be/YmlMsvNGTKA"},{"day":"Push #1","name":"Pec Deck (w/ Integrated Partials)","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Bent-Over Cable Pec Flye (w/ Integrated Partials)","sub2":"DB Flye (w/ Integrated Partials)","notes":"Set up the pec deck to allow for maximum stretch. On all sets, alternate full-ROM reps and half-ROM reps (i.e. do 1 rep with full-ROM, then 1 rep half-ROM (in the stretched/bottom half), then 1 rep full-ROM, then 1 rep half-ROM). Repeat until you've reached the target reps and an RPE of 9-10.","muscle":"Chest","yt":"https://youtu.be/NPa8YvUg4CM","sub1yt":"https://youtu.be/DKaKmnB0BO8","sub2yt":"https://youtu.be/AOsdioes78c"},{"day":"Push #1","name":"Overhead Cable Triceps Extension (Bar)","b":1,"sup":"","warmup":"1","sets":"3","reps":"8","rest":"~1-2 min","sub1":"Overhead Cable Triceps Extension (Rope)","sub2":"DB Skull Crusher","notes":"Feel a nasty stretch on the triceps throughout the entire negative. Pause for 1 second in the stretch part of each rep.","muscle":"Triceps","yt":"https://youtu.be/9_I1PqZAjdA","sub1yt":"https://youtu.be/GYoUoVNlbGc","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Push #1","name":"Triceps Pressdown (Bar)","b":1,"sup":"","warmup":"1","sets":"2","reps":"8-10","rest":"~1-2 min","sub1":"Triceps Pressdown (Rope)","sub2":"Close-Grip Assisted Dip","notes":"These are meant to be fairly heavy, which is why we're using a bar instead of a rope. Aim to add some weight week to week at the set rep target. Always keep the form tight as you overload the triceps.","muscle":"Triceps","yt":"https://youtu.be/o4eazahiXQw","sub1yt":"https://youtu.be/bCa036rGtVU","sub2yt":"https://youtu.be/mpcPTUAhfto"},{"day":"Push #1","name":"Cable Crunch","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Crunch","sub2":"Plate-Weighted Crunch","notes":"Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","muscle":"Abs","yt":"https://youtu.be/LvJM9V3D_CQ","sub1yt":"https://youtu.be/KlxdhDSi5Dc","sub2yt":"https://youtu.be/mP99WSRI6Bc"},{"day":"Legs #1","name":"Seated Leg Curl","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Legs #1","name":"Machine Hip Adduction","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Legs #1","name":"Hack Squat","b":1,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-5 min","sub1":"Machine Squat","sub2":"Front Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/TWUnnDK8rck","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/TRwhJ0TCoqI"},{"day":"Legs #1","name":"Leg Extension","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Legs #1","name":"Leg Press Calf Press","b":1,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Donkey Calf Raise","sub2":"Seated Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/-mcxziH_KdM","sub1yt":"https://youtu.be/LC9SO-pIXqA","sub2yt":"https://youtu.be/6pfj0G7VKdM"},{"day":"Arms & Weak Points #1","name":"Weak Point Exercise 1","b":1,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points #1","name":"Weak Point Exercise 2 (optional)","b":1,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points #1","name":"Bayesian Cable Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Incline Curl","sub2":"DB Scott Curl","notes":"If you have a left-right bicep size imbalance, do these 1 arm at a time, starting with the weaker arm. Take the weaker arm to an RPE of 9-10. Then match the reps with the other arm (stop once you've matched the reps, even if the RPE is lower). If you don't have a size imbalance, do these both arms at the same time.","muscle":"Biceps","yt":"https://youtu.be/_w_Uan2dG-4","sub1yt":"https://youtu.be/KSJc8bhSjB0","sub2yt":"https://youtu.be/u00CqDeAHTE"},{"day":"Arms & Weak Points #1","name":"Seated DB French Press","b":1,"sup":"","warmup":"1","sets":"3","reps":"10","rest":"~1-2 min","sub1":"EZ-bar Skull Crusher","sub2":"DB Skull Crusher","notes":"Place both palms under the head of a dumbbell and perform overhead extensions. Feel a deep stretch on your triceps at the bottom. Avoid pausing at the top of each rep.","muscle":"Triceps","yt":"https://youtu.be/5KX0EjOTMaI","sub1yt":"https://youtu.be/oDKGCsTjAk8","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Arms & Weak Points #1","name":"Bottom-2/3 Constant Tension Preacher Curl","b":1,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bottom-2/3 EZ-Bar Curl","sub2":"Spider Curl","notes":"Stay in the bottom 2/3 of the curl. Don't squeeze all the way up to the top. Keep your triceps firmly pinned against the pad as you curl. No pausing at the top or bottom: constant tension on the biceps!","muscle":"Biceps","yt":"https://youtu.be/vHBedP8oeCA","sub1yt":"https://youtu.be/fXI8gN6pq1k","sub2yt":"https://youtu.be/jw9tvoGLJmo"},{"day":"Arms & Weak Points #1","name":"Cable Triceps Kickback","b":1,"sup":"","warmup":"0","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Bench Dip","sub2":"DB Triceps Kickback","notes":"There are two ways you can do this: upright or bent over. Choose the one that feels more comfortable for you. The main thing is that when you're in the full squeeze, your shoulder should be positioned back behind your torso.","muscle":"Triceps","yt":"https://youtu.be/FGJ64JyKod0","sub1yt":"https://youtu.be/3CaIq8jZe18","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points #1","name":"Roman Chair Leg Raise","b":1,"sup":"","warmup":"0","sets":"3","reps":"10-20","rest":"~1-2 min","sub1":"Hanging Leg Raise","sub2":"Reverse Crunch","notes":"Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit RPE 9-10 (0-1 reps shy of failure) with controlled form.","muscle":"Abs","yt":"https://youtu.be/irOzFVqJ0IE","sub1yt":"https://youtu.be/rGqwkinWqYI","sub2yt":"https://youtu.be/fYZmIC9_sx4"},{"day":"Pull #2 (Mid-Back)","name":"Super-ROM Overhand Cable Row","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Overhand Machine Row","sub2":"Arm-Out Single-Arm DB Row","notes":"Set up a wide grip pulldown bar on a seated cable row. Using a double overhand grip, perform rows while leaning forward on the negative and then extend your torso to be upright as you finish the row.","muscle":"Back","yt":"https://youtu.be/a7AH8W7dQIw","sub1yt":"https://youtu.be/WtokJfvWl-I","sub2yt":"https://youtu.be/1ydRu2K6oHg"},{"day":"Pull #2 (Mid-Back)","name":"Arms-Extended 45\u00b0 Hyperextension","b":1,"sup":"","warmup":"1","sets":"2","reps":"10-20","rest":"~2-3 min","sub1":"Prisoner 45\u00b0 Hyperextension","sub2":"Good Morning (Light Weight)","notes":"Keep your arms extended out at 45\u00b0 as you do back extensions. You should feel a crazy burn in your mid-back and lower back.","muscle":"Glutes","yt":"https://youtu.be/PrwC-5NTCCs","sub1yt":"https://youtu.be/jshWFhUTE-o","sub2yt":"https://youtu.be/c-Yj6God14s"},{"day":"Pull #2 (Mid-Back)","name":"Lean-Back Lat Pulldown","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Lean-Back Machine Pulldown","sub2":"Medium-Grip Pull Up","notes":"Initiate the pulldown with a straight up posture. As you pull the bar down, lean back by about 15-30\u00b0 to get the mid-back more involved. Softly touch the bar to your chest on every rep and, even though you're leaning back, still control the weight!","muscle":"Back","yt":"https://youtu.be/Zjzt4MRbAlc","sub1yt":"https://youtu.be/CrfvmSGfT2c","sub2yt":"https://youtu.be/5h_NehuTqe4"},{"day":"Pull #2 (Mid-Back)","name":"Inverse DB Zottman Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Slow-Eccentric DB Curl","sub2":"Hammer Curl","notes":"Do a hammer curl on the positive, then turn your palms facing up at the top and use a palms-up grip on the negative.","muscle":"Biceps","yt":"https://youtu.be/jBIvbpyb99M","sub1yt":"https://youtu.be/49VVIiqqOOs","sub2yt":"https://youtu.be/xY3sQXYhk7A"},{"day":"Pull #2 (Mid-Back)","name":"Cable Reverse Flye (Mechanical Dropset)","b":1,"sup":"","warmup":"0","sets":"3","reps":"5,4,3+","rest":"~1-2 min","sub1":"Reverse Pec Deck","sub2":"Bent-Over Reverse DB Flye","notes":"You'll probably want to watch the video for this one. Take ~3 big steps back from the cable machine and do your first 5 reps. After those first 5 reps, immediately (without resting) take 1 step forward and do another 4 reps. Then (without resting) take another step forward and do at least another 3 reps (or until you hit RPE 9-10).","muscle":"Delts","yt":"https://youtu.be/nN5RV1arpfM","sub1yt":"https://youtu.be/Y8fb_rtEU_4","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Pull #2 (Mid-Back)","name":"Cable Paused Shrug-In","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Shrug","sub2":"DB Shrug","notes":"Shrug up and in. Think about shrugging \"up to your ears\". 1-2 second pause in the squeeze (at the top) of each rep, then another 1-2 second pause in the stretch (at the bottom) of each rep.","muscle":"Back","yt":"https://youtu.be/Hy6f1Lz_PiA","sub1yt":"https://youtu.be/2KDc6iAcrAw","sub2yt":"https://youtu.be/moFqLlptX7Q"},{"day":"Push #2","name":"Machine Shoulder Press","b":1,"sup":"","warmup":"2-3","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Shoulder Press","sub2":"Seated DB Shoulder Press","notes":"Ensure that your elbows break at least 90\u00b0. Mind-muscle connection with your delts. Smooth, controlled reps.","muscle":"Delts","yt":"https://youtu.be/SCQVmN1gYsk","sub1yt":"https://youtu.be/OfjncdW_Vyc","sub2yt":"https://youtu.be/B8PB5RPhTWQ"},{"day":"Push #2","name":"Cross-Body Cable Y-Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Machine Lateral Raise","sub2":"DB Lateral Raise","notes":"Think about \"drawing a sword\" as you do the positive. Sweep your arm up, out and across your body. It may take a few weeks to get used to these if you haven't done them before, but once they click, they really click.","muscle":"Delts","yt":"https://youtu.be/64RFJSCJuN8","sub1yt":"https://youtu.be/nc6pAci8Tpg","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Push #2","name":"Paused Assisted Dip","b":1,"sup":"","warmup":"2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Decline Machine Chest Press","sub2":"Decline Barbell Press","notes":"Slow 2-3 second negative. 1-2 second pause at the bottom. Explode with control on the way up. Go as deep as your shoulders comfortably allow, trying to at least break a 90\u00b0 elbow angle.","muscle":"Chest","yt":"https://youtu.be/RyGOGviYWts","sub1yt":"https://youtu.be/AABuMGK9H28","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Push #2","name":"Low-Incline Dumbbell Flye","b":1,"sup":"","warmup":"1","sets":"2","reps":"15-20","rest":"~2-3 min","sub1":"Low-To-High Cable Crossover","sub2":"Pec Deck","notes":"Focus on feeling a deep stretch in your pecs at the bottom of each rep. Keep the dumbbells in the bottom ~3/4 of the range of motion as there will be no tension on the pecs at the top. We are including these because the dumbbells' resistance profile really accentuates the stretch.","muscle":"Chest","yt":"https://youtu.be/gfIx0U5bTMA","sub1yt":"https://youtu.be/1LhGmhVFe2Y","sub2yt":"https://youtu.be/xei-JEpfAS4"},{"day":"Push #2","name":"Katana Triceps Extension","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Rope)","sub2":"DB French Press","notes":"Flare your elbows out at about 45\u00b0 and keep your elbows locked in place as you complete the extensions.","muscle":"Triceps","yt":"https://youtu.be/R7f45Mv7yyg","sub1yt":"https://youtu.be/GYoUoVNlbGc","sub2yt":"https://youtu.be/5KX0EjOTMaI"},{"day":"Push #2","name":"Ab Wheel Rollout","b":1,"sup":"","warmup":"0","sets":"3","reps":"10-20","rest":"~1-2 min","sub1":"Swiss Ball Rollout","sub2":"LLPT Plank","notes":"Don't just bend at your hips, use your abs to lower yourself down under control and pull yourself back up. If you don't have the core strength to get all the way extended at the bottom, try to progressively increase the ROM week to week.","muscle":"Abs","yt":"https://youtu.be/gGTgyCU9gcg","sub1yt":"https://youtu.be/FvekMyIs-yk","sub2yt":"https://youtu.be/Q8ebdJL_-lo"},{"day":"Legs #2","name":"Lying Leg Curl","b":1,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~1-2 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Legs #2","name":"Leg Press","b":1,"sup":"","warmup":"2-4","sets":"3","reps":"8","rest":"~1-2 min","sub1":"Belt Squat","sub2":"High-Bar Back Squat","notes":"Feet lower on the platform for more quad focus. Get as deep as you can without excessive back rounding. Control the negative and do a slight pause at the bottom of each rep. Try to add a little weight each week at the same rep count.","muscle":"Quads","yt":"https://youtu.be/ksBaBSfmZf4","sub1yt":"https://youtu.be/JvAc3k4Jdqw","sub2yt":"https://youtu.be/V-B_Y-OvOTQ"},{"day":"Legs #2","name":"Smith Machine Lunge","b":1,"sup":"","warmup":"2-3","sets":"2","reps":"8","rest":"~3-4 min","sub1":"Barbell Lunge","sub2":"DB Step Up","notes":"2 sets each leg. Minimize contribution from the back leg. Mind-muscle connection with your glutes here!","muscle":"Quads","yt":"https://youtu.be/FPIsTw-jh5s","sub1yt":"https://youtu.be/DHSuW_Wsx6M","sub2yt":"https://youtu.be/3FNfi_PrP9Y"},{"day":"Legs #2","name":"Machine Hip Adduction","b":1,"sup":"A1","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Legs #2","name":"Sissy Squat","b":1,"sup":"A2","warmup":"1","sets":"3","reps":"10-12","rest":"~0.5-1 min","sub1":"Leg Extension","sub2":"Goblet Squat","notes":"Allow yourself to come up onto your toes and push your knees forward past your toes. This is safe for the knees. If you feel knee pain doing them, though, feel free to go with a substitution. They may feel awkward at first, but they're really underrated for the quads! Don't give up on them too quickly.","muscle":"Quads","yt":"https://youtu.be/Ma99aw-VDJQ","sub1yt":"https://youtu.be/G0_M9LBCT0o","sub2yt":"https://youtu.be/S2agsLlUSII"},{"day":"Legs #2","name":"Standing Calf Raise","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Leg Press Calf Press","sub2":"Donkey Calf Raise","notes":"1-2 second pause at the bottom of each rep. Instead of just going up onto your toes, think about rolling your ankle back and forth on the balls of your feet.","muscle":"Calves","yt":"https://youtu.be/WMkCGNwo5ts","sub1yt":"https://youtu.be/-mcxziH_KdM","sub2yt":"https://youtu.be/LC9SO-pIXqA"},{"day":"Arms & Weak Points #2","name":"Weak Point Exercise 1","b":1,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"},{"day":"Arms & Weak Points #2","name":"Weak Point Exercise 2 (optional)","b":1,"sup":"","warmup":"1-3","sets":"2","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"If your weak point is feeling recovered (not sore or fatigued) then feel free to hit Exercise 2. If your weak point is feeling tired or sore, do not perform the second weak point exercise this week.","muscle":"Other"},{"day":"Arms & Weak Points #2","name":"Cable Skull Crusher","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"EZ-Bar Skull Crusher","sub2":"DB Skull Crusher","notes":"Allow the cable to move back behind your head for maximum stretch on the triceps. Reach full extension with your elbows still around eye level at the top.","muscle":"Triceps","yt":"https://youtu.be/L3lMBRwsFlw","sub1yt":"https://youtu.be/oDKGCsTjAk8","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Arms & Weak Points #2","name":"Kneeling Overhead Cable Curl","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Overhead Cable Curl","sub2":"Spider Curl","notes":"Kneel down, stick your arm straight out to the side and do cable curls. You should feel a tight squeeze at the top of each rep on these.","muscle":"Biceps","yt":"https://youtu.be/KokUK4RgsHc","sub1yt":"https://youtu.be/0ZjD1gM8ldQ","sub2yt":"https://youtu.be/jw9tvoGLJmo"},{"day":"Arms & Weak Points #2","name":"Triceps Diverging Pressdown (Long Rope or 2 Ropes)","b":1,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Cable Triceps Kickback","sub2":"DB Triceps Kickback","notes":"Use two long ropes or one long rope. Lean slightly forward, flare your elbows slightly out and keep your arms back in line with your torso. Then do triceps pressdowns, getting a full, big squeeze at the bottom.","muscle":"Triceps","yt":"https://youtu.be/20tbMlP71Nc","sub1yt":"https://youtu.be/FGJ64JyKod0","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points #2","name":"Incline DB Stretch-Curl","b":1,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"DB Incline Curl","sub2":"Bayesian Cable Curl","notes":"Keep your upper back planted against the bench, rotate your arms outward until you feel a massive stretch in your biceps. Go light on these and instead focus on feeling your biceps pull and squeeze.","muscle":"Biceps","yt":"https://youtu.be/Z0NIYS9nyoQ","sub1yt":"https://youtu.be/KSJc8bhSjB0","sub2yt":"https://youtu.be/_w_Uan2dG-4"},{"day":"Arms & Weak Points #2","name":"Cable Crunch","b":1,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Crunch","sub2":"Plate-Weighted Crunch","notes":"Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","muscle":"Abs","yt":"https://youtu.be/LvJM9V3D_CQ","sub1yt":"https://youtu.be/KlxdhDSi5Dc","sub2yt":"https://youtu.be/mP99WSRI6Bc"},{"day":"Push #1","name":"Smith Machine JM Press","b":1,"sup":"","warmup":"1-2","sets":"2","reps":"15-20","rest":"~2-3 min","sub1":"Barbell JM Press","sub2":"Close-Grip Bench Press","notes":"Lower the bar down to your chin. Think of the movement as a combination of a skull crusher and a close-grip bench press.","muscle":"Back","yt":"https://youtu.be/WnhjBiezSa8","sub1yt":"https://youtu.be/0F28Ha_9Y8Y","sub2yt":"https://youtu.be/XnYH1RfVRKk"},{"day":"Pull #1 (Lats)","name":"Lat-Focused Cable Row","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Half-Kneeling 1-Arm Lat Pulldown","sub2":"Elbows-In 1-Arm DB Row","notes":"Keep your torso locked in a fixed position (don't lean forward on the negative). Drive your elbows down and back to engage the lats. Keep your elbows tucked in to your sides.","muscle":"Back","yt":"https://youtu.be/w11Kqjm-ycE","sub1yt":"https://youtu.be/r8K1Fkch5go","sub2yt":"https://youtu.be/SwloMZs8ZVk"},{"day":"Pull #1 (Lats)","name":"Paused Barbell RDL","b":2,"sup":"","warmup":"2-3","sets":"2","reps":"8","rest":"~3-4 min","sub1":"Paused DB RDL","sub2":"Glute-Ham Raise","notes":"The RPE is intentionally low here because these will cause a lot of muscle damage. Don't be tempted to go too heavy. 1 second pause at the bottom of each rep. To keep tension on the hamstrings, stop about 75% of the way to full lockout on each rep (i.e. stay in the bottom 3/4 of the range of motion).","muscle":"Hamstrings","yt":"https://youtu.be/74uXdbCYZQY","sub1yt":"https://youtu.be/gzavDZmYDHk","sub2yt":"https://youtu.be/9ksG-O0ZUto"},{"day":"Pull #1 (Lats)","name":"Chest-Supported T-Bar Row + Kelso Shrug","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10 + 4-6","rest":"~2-3 min","sub1":"Machine Chest-Supported Row + Kelso Shrug","sub2":"Incline Chest-Supported DB Row + Kelso Shrug","notes":"Do 8-10 reps as a normal T-Bar row, driving your elbows back at roughly 45\u00b0 and squeezing your shoulder blades together. Without resting, do another 4-6 reps as Kelso Shrugs (just squeeze your shoulder blades together without rowing all the way back with your arms).","muscle":"Back","yt":"https://youtu.be/qsmjaYao9pA","sub1yt":"https://youtu.be/SUAafTp7WTQ","sub2yt":"https://youtu.be/IBRrEPQZUO0"},{"day":"Pull #1 (Lats)","name":"1-Arm Lat Pull-In","b":2,"sup":"","warmup":"1","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Wide-Grip Lat Pulldown","sub2":"Wide-Grip Band-Assisted Pull-Up","notes":"Pull the cable in from the side. Keep a mind-muscle connection with your lats and try to prevent your biceps from taking over. Palpate (feel) your lats with your other hand if that helps you connect with them better.","muscle":"Back","yt":"https://youtu.be/RMGuHVQKOms","sub1yt":"https://youtu.be/IYXRrYXfVLc","sub2yt":"https://youtu.be/6LGHiZ5iZbE"},{"day":"Pull #1 (Lats)","name":"N1-Style Short-Head Curl","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Concentration Curl","sub2":"DB Preacher Curl","notes":"Brace against your knee with your non-working hand and curl across your body, toward your opposite shoulder.","muscle":"Biceps","yt":"https://youtu.be/qpzwJd7mr3Y","sub1yt":"https://youtu.be/Oq7gJuAuJh0","sub2yt":"https://youtu.be/EWOxgi81xFA"},{"day":"Pull #1 (Lats)","name":"Reverse Pec Deck (w/ Integrated Partials)","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-15","rest":"~1-2 min","sub1":"Reverse Cable Flye (w/ Integrated Partials)","sub2":"Bent-Over Reverse DB Flye (w/ Integrated Partials)","notes":"Sweep the weight out instead of pulling the weight back. Mind-muscle connection with rear delts. On all sets, alternate full-ROM reps and half-ROM reps (i.e. do 1 rep with full-ROM, then 1 rep half-ROM (in the stretched/bottom half), then 1 rep full-ROM, then 1 rep half-ROM). Repeat until you've reached the target reps and an RPE of 9-10.","muscle":"Delts","yt":"https://youtu.be/KDeYqB9GYeg","sub1yt":"https://youtu.be/QkAMC88WfXw","sub2yt":"https://youtu.be/eE3v36jNqDE"},{"day":"Push #1","name":"Cuffed Behind-The-Back Lateral Raise","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cross-Body Cable Y-Raise","sub2":"DB Lateral Raise","notes":"Raise the cables up in a \"Y\" motion. Really try to connect with the middle delt fibers as you sweep the weight up and out.","muscle":"Delts","yt":"https://youtu.be/fjiOCmFljDM","sub1yt":"https://youtu.be/64RFJSCJuN8","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Push #1","name":"Low Incline DB Press","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Low Incline Machine Press","sub2":"Low Incline Barbell Press","notes":"Set the bench at a ~15\u00b0 incline. Do a slight elbow tuck on the negative and then flare as you push (assuming this doesn't bother your shoulders). Nice, smooth reps here. No pausing at the top or bottom: constant tension on the pecs!","muscle":"Chest","yt":"https://youtu.be/YmlMsvNGTKA","sub1yt":"https://youtu.be/JmsY9nSqX9E","sub2yt":"https://youtu.be/_74oMsrIFXA"},{"day":"Push #1","name":"Dual-Cable Triceps Press","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Bar)","sub2":"DB Skull Crusher","notes":"Hold the cables without a handle and get them into position just above your shoulders (around chin level). Press the weight forward (straight out in front of you), not up overhead like in a standard overhead triceps extension.","muscle":"Triceps","yt":"https://youtu.be/SNcQJjXWa_E","sub1yt":"https://youtu.be/9_I1PqZAjdA","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Push #1","name":"Bent-Over Cable Pec Flye (w/ Integrated Partials)","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Pec Deck (w/ Integrated Partials)","sub2":"DB Flye (w/ Integrated Partials)","notes":"Lean forward until your torso is parallel with the floor, flye straight out and down toward the floor. Stretch and squeeze the pecs! Stay locked in.","muscle":"Chest","yt":"https://youtu.be/DKaKmnB0BO8","sub1yt":"https://youtu.be/NPa8YvUg4CM","sub2yt":"https://youtu.be/AOsdioes78c"},{"day":"Push #1","name":"Deficit Pushup","b":2,"sup":"","warmup":"1","sets":"1","reps":"AMRAP","rest":"~1-2 min","sub1":"Close-Grip Push Up","sub2":"Bodyweight Dip","notes":"Slow negative with a deep stretch at the bottom of each rep before exploding back up on the positive.","muscle":"Back","yt":"https://youtu.be/3AZSudcQ1N0","sub1yt":"https://youtu.be/z7Fx-RY4kXw","sub2yt":"https://youtu.be/iswhjR-_-Xg"},{"day":"Push #1","name":"Cable Crunch","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Machine Crunch","sub2":"Plate-Weighted Crunch","notes":"Round your lower back as you crunch. Maintain a mind-muscle connection with your 6-pack.","muscle":"Abs","yt":"https://youtu.be/LvJM9V3D_CQ","sub1yt":"https://youtu.be/KlxdhDSi5Dc","sub2yt":"https://youtu.be/mP99WSRI6Bc"},{"day":"Legs #1","name":"Seated Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Lying Leg Curl","sub2":"Nordic Ham Curl","notes":"Lean forward over the machine to get a maximum stretch in your hamstrings.","muscle":"Hamstrings","yt":"https://youtu.be/oWJBLChYZOQ","sub1yt":"https://youtu.be/y28L1m1PYUQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Legs #1","name":"Machine Hip Adduction","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle connection with your inner thighs. These are great for adding thigh mass from the front! Push them hard!","muscle":"Glutes","yt":"https://youtu.be/FMSCZYu1JhE","sub1yt":"https://youtu.be/6GYTbv-LtV0","sub2yt":"https://youtu.be/QRLGyl5-i4k"},{"day":"Legs #1","name":"Smith Machine Squat","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"4, 6, 8","rest":"~3-5 min","sub1":"Machine Squat","sub2":"DB Bulgarian Split Squat","notes":"We're using a reverse pyramid on this exercise. Warm-up as usual to your first working set for 4 reps. This first set will be your heaviest set. Then for set 2, drop the weight back ~10-15% and do 6 reps. Then for set 3, drop the weight back another 10-15% and do 8 reps.","muscle":"Quads","yt":"https://youtu.be/wSHxfQJe1ic","sub1yt":"https://youtu.be/whJzh_27yHs","sub2yt":"https://youtu.be/Z1uu0uHYl20"},{"day":"Legs #1","name":"Leg Extension","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Step-Up","sub2":"Reverse Nordic","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/3FNfi_PrP9Y","sub2yt":"https://youtu.be/aHS9tKzJXik"},{"day":"Legs #1","name":"DB Calf Jumps","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"Leg Press Calf Jumps","sub2":"Standing Calf Raise","notes":"Hold a dumbbell and perform a jumping motion without actually leaving the floor, using a slight knee bend, but mostly relying on your calves/ankles to drive the \"jump\". I believe I built a lot of calf mass by doing jump rope; these are meant to provide a similar stimulus, but with more tension.","muscle":"Calves","yt":"https://youtu.be/JkY3nBTbRac","sub1yt":"https://youtu.be/FKY1GmU-nYI","sub2yt":"https://youtu.be/WMkCGNwo5ts"},{"day":"Arms & Weak Points #1","name":"Weak Point Exercise 1","b":2,"sup":"","warmup":"1-3","sets":"3","reps":"8-12","rest":"~1-3 min","sub1":"See The Weak Point Table for sub options","sub2":"See The Weak Point Table for sub options","notes":"Decide on your weak point using The Weak Point Table in your Hypertrophy Handbook. Perform ONE of the exercises listed under Exercise 1 for the sets and reps provided here.","muscle":"Other"}, uscle":"Triceps","yt":"https://youtu.be/20tbMlP71Nc","sub1yt":"https://youtu.be/FGJ64JyKod0","sub2yt":"https://youtu.be/YdUUYFgpA7g"},{"day":"Arms & Weak Points #1","name":"Reverse-Grip Cable Curl","b":2,"sup":"","warmup":"0","sets":"2","reps":"12-15","rest":"~1-2 min","sub1":"Reverse-Grip EZ-Bar Curl","sub2":"Reverse-Grip DB Curl","notes":"Grab a cable bar with your palms facing down and perform curls. These will work the back of your forearm, brachialis and biceps!","muscle":"Biceps","yt":"https://youtu.be/xtZvYrfw2Is","sub1yt":"https://youtu.be/IZNaQzWXgwA","sub2yt":"https://youtu.be/KYfVrzmh-GU"},{"day":"Arms & Weak Points #1","name":"Roman Chair Leg Raise","b":2,"sup":"","warmup":"0","sets":"3","reps":"10-20","rest":"~1-2 min","sub1":"Hanging Leg Raise","sub2":"Reverse Crunch","notes":"Allow your lower back to round as you curl your legs up. 10-20 reps is a broad range on purpose: just go until you hit RPE 9-10 (0-1 reps shy of failure) with controlled form.","muscle":"Abs","yt":"https://youtu.be/irOzFVqJ0IE","sub1yt":"https://youtu.be/rGqwkinWqYI","sub2yt":"https://youtu.be/fYZmIC9_sx4"},{"day":"Pull #2 (Mid-Back)","name":"Dual-Handle Lat Pulldown (Mid-back + Lats)","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Overhand Lat Pulldown","sub2":"Pull-Up","notes":"Lean back by ~15\u00b0 and drive your elbows down as you squeeze your shoulder blades together. This should feel like a mix of lats and mid-traps.","muscle":"Back","yt":"https://youtu.be/NwQ5Ch5t5Vk","sub1yt":"https://youtu.be/IAktPXPhWYQ","sub2yt":"https://youtu.be/5h_NehuTqe4"},{"day":"Pull #2 (Mid-Back)","name":"Arms-Extended 45\u00b0 Hyperextension","b":2,"sup":"","warmup":"1","sets":"2","reps":"10-20","rest":"~2-3 min","sub1":"Prisoner 45\u00b0 Hyperextension","sub2":"Good Morning (Light Weight)","notes":"Keep your arms extended out at 45\u00b0 as you do back extensions. You should feel a crazy burn in your mid-back and lower back.","muscle":"Glutes","yt":"https://youtu.be/PrwC-5NTCCs","sub1yt":"https://youtu.be/jshWFhUTE-o","sub2yt":"https://youtu.be/c-Yj6God14s"},{"day":"Pull #2 (Mid-Back)","name":"Chest-Supported Machine Row","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Chest-Supported T-Bar Row","sub2":"Helms Row","notes":"Flare elbows out at roughly 45\u00b0 and squeeze your shoulder blades together hard at the top of each rep.","muscle":"Back","yt":"https://youtu.be/QZ7VZpjNTG8","sub1yt":"https://youtu.be/-FAxUZoPDc4","sub2yt":"https://youtu.be/DjO2G9DIerQ"},{"day":"Pull #2 (Mid-Back)","name":"Concentration Cable Curl","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"DB Concentration Curl","sub2":"DB Preacher Curl","notes":"Place your working elbow against your knee and perform strict form curls.","muscle":"Biceps","yt":"https://youtu.be/BFZyW_7ld0c","sub1yt":"https://youtu.be/Oq7gJuAuJh0","sub2yt":"https://youtu.be/EWOxgi81xFA"},{"day":"Pull #2 (Mid-Back)","name":"Rear Delt 45\u00b0 Cable Flye","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~1-2 min","sub1":"DB Rear Delt Swing","sub2":"Bent-Over Reverse DB Flye","notes":"Pull with one arm at a time, bracing with your non-working hand against the machine. Try to align your arm and the cable in a straight line at the bottom of the flye.","muscle":"Delts","yt":"https://youtu.be/8iXorduqXC8","sub1yt":"https://youtu.be/1D4r_xpln88","sub2yt":"https://youtu.be/9BfxdGmekv4"},{"day":"Push #2","name":"Seated DB Shoulder Press","b":2,"sup":"","warmup":"2-3","sets":"3","reps":"10-12","rest":"~1-2 min","sub1":"Seated Barbell Shoulder Press","sub2":"Standing DB Arnold Press","notes":"Slightly rotate the dumbbells in on the negative and flare your elbows out as you push.","muscle":"Delts","yt":"https://youtu.be/B8PB5RPhTWQ","sub1yt":"https://youtu.be/rRpQJAJZgiI","sub2yt":"https://youtu.be/xBJBTfPcvhM"},{"day":"Push #2","name":"Cross-Body Cable Y-Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"10-12","rest":"~2-3 min","sub1":"Machine Lateral Raise","sub2":"DB Lateral Raise","notes":"Think about \"drawing a sword\" as you do the positive. Sweep your arm up, out and across your body. It may take a few weeks to get used to these if you haven't done them before, but once they click, they really click.","muscle":"Delts","yt":"https://youtu.be/64RFJSCJuN8","sub1yt":"https://youtu.be/nc6pAci8Tpg","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Push #2","name":"Decline Machine Chest Press","b":2,"sup":"","warmup":"2","sets":"3","reps":"8-10","rest":"~2-3 min","sub1":"Decline Smith Machine Press","sub2":"Decline Barbell Press","notes":"Feel your pecs stretching apart on the negative. Mind-muscle connection with lower pecs.","muscle":"Chest","yt":"https://youtu.be/AABuMGK9H28","sub1yt":"https://youtu.be/MlqHZEhBGtw","sub2yt":"https://youtu.be/2Vg5j_UZr-U"},{"day":"Push #2","name":"Overhead Cable Triceps Extension (Bar)","b":2,"sup":"","warmup":"1","sets":"2","reps":"8-10","rest":"~2-3 min","sub1":"Overhead Cable Triceps Extension (Rope)","sub2":"DB Skull Crusher","notes":"Feel a nasty stretch on the triceps throughout the entire negative. Pause for 1 second in the stretch part of each rep.","muscle":"Triceps","yt":"https://youtu.be/9_I1PqZAjdA","sub1yt":"https://youtu.be/GYoUoVNlbGc","sub2yt":"https://youtu.be/fbLTzgTKOR8"},{"day":"Push #2","name":"Stomach Vacuums","b":2,"sup":"","warmup":"0","sets":"2","reps":"10-15 sec hold","rest":"~1-2 min","sub1":"LLPT Plank","sub2":"Ab Wheel Rollout","notes":"Suck your stomach in and hold it for 10-15 seconds, repeat 2x.","muscle":"Back","yt":"https://youtu.be/dyFeDqVApFU","sub1yt":"https://youtu.be/Q8ebdJL_-lo","sub2yt":"https://youtu.be/gGTgyCU9gcg"},{"day":"Push #2","name":"Super-ROM DB Lateral Raise","b":2,"sup":"","warmup":"1","sets":"3","reps":"12-15","rest":"~0.5-1 min","sub1":"Cable Upright Row","sub2":"DB Lateral Raise","notes":"Perform lateral raises as normal, except going until your hands are up overhead. As you break parallel, you will use more upper traps to move the weight. Feel free to squeeze your upper traps at the top. If you feel shoulder pain when going all the way up, try pointing your thumb up or simply stop at parallel and do normal lateral raises.","muscle":"Delts","yt":"https://youtu.be/nW5pGot-Hok","sub1yt":"https://youtu.be/Rm7CPzKLK1M","sub2yt":"https://youtu.be/Z8OrSIk_574"},{"day":"Legs #2","name":"Lying Leg Curl","b":2,"sup":"","warmup":"1-2","sets":"3","reps":"8-10","rest":"~1-2 min","sub1":"Seated Leg Curl","sub2":"Nordic Ham Curl","notes":"Set the machine so that you get the biggest stretch possible at the bottom. Prevent your butt from popping up as you curl.","muscle":"Hamstrings","yt":"https://youtu.be/y28L1m1PYUQ","sub1yt":"https://youtu.be/oWJBLChYZOQ","sub2yt":"https://youtu.be/UbNb5Tsl46c"},{"day":"Legs #2","name":"Smith Machine Reverse Lunge","b":2,"sup":"","warmup":"2-4","sets":"3","reps":"8","rest":"~1-2 min","sub1":"DB Reverse Lunge","sub2":"DB Walking Lunge","notes":"Set one leg back on the negative and then drive the weight up using your front leg. Try to minimize assistance from your back leg.","muscle":"Quads","yt":"https://youtu.be/D0KZo_gBsw0","sub1yt":"https://youtu.be/QSGe2Sd8kUI","sub2yt":"https://youtu.be/BC_eDtrB-M4"},{"day":"Legs #2","name":"Leg Extension","b":2,"sup":"","warmup":"1-2","sets":"4","reps":"15-20","rest":"~3-4 min","sub1":"Reverse Nordic","sub2":"Sissy Squats","notes":"Set the seat back as far as it will go while still feeling comfortable. Grab the handles as hard as you can to pull your butt down into the seat. Use a 2-3 second negative. Feel your quads pulling apart on the negative.","muscle":"Quads","yt":"https://youtu.be/G0_M9LBCT0o","sub1yt":"https://youtu.be/aHS9tKzJXik","sub2yt":"https://youtu.be/eWAjlO4FWPQ"},{"day":"Legs #2","name":"Machine Hip Adduction","b":2,"sup":"A1","warmup":"1","sets":"3","reps":"10-12","rest":"N/A","sub1":"Cable Hip Adduction","sub2":"Copenhagen Hip Adduction","notes":"Mind-muscle con /* ---------- charts ---------- */
function lineChart(series,o){
  o=o||{};
  var W=640,H=o.h||190,PL=40,PR=12,PT=12,PB=24;
  var all=[]; series.forEach(function(s){ s.pts.forEach(function(p){ all.push(p.y); }); });
  if(!all.length) return '<p class="empty">'+(o.empty||"Nothing logged yet.")+'</p>';
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all);
  if(lo===hi){ lo-=1; hi+=1; }
  var pd=(hi-lo)*.15; lo-=pd; hi+=pd;
  var xs=o.xMin!==undefined?o.xMin:1, xe=o.xMax!==undefined?o.xMax:12;
  if(xe===xs) xe=xs+1;
  var X=function(x){ return PL+(x-xs)/(xe-xs)*(W-PL-PR); };
  var Y=function(y){ return PT+(1-(y-lo)/(hi-lo))*(H-PT-PB); };
  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">';
  [0,.5,1].forEach(function(f){
    var y=PT+f*(H-PT-PB);
    g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="'+TC.grid+'"/>';
    g+='<text x="'+(PL-6)+'" y="'+(y+4)+'" fill="'+TC.dim+'" font-size="11" font-family="Azeret Mono, monospace" text-anchor="end">'+fmt(hi-f*(hi-lo),o.dec?1:0)+'</text>';
  });
  for(var x=Math.ceil(xs);x<=xe;x++){
    if((xe-xs)>8&&x%2!==0) continue;
    g+='<text x="'+X(x)+'" y="'+(H-6)+'" fill="'+TC.dim+'" font-size="11" font-family="Azeret Mono, monospace" text-anchor="middle">'+(o.xLabel?o.xLabel(x):x)+'</text>';
  }
  if(o.zero!==undefined && o.zero>=lo && o.zero<=hi)
    g+='<line x1="'+PL+'" y1="'+Y(o.zero)+'" x2="'+(W-PR)+'" y2="'+Y(o.zero)+'" stroke="'+TC.zero+'" stroke-dasharray="3 3"/>';
  series.forEach(function(s){
    if(!s.pts.length) return;
    var d=s.pts.map(function(p,i){ return (i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1); }).join(" ");
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||2.5)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="4 4"':'')+'/>';
    if(s.dots!==false) s.pts.forEach(function(p){ g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3.2" fill="'+TC.bg+'" stroke="'+s.color+'" stroke-width="2"/>'; });
  });
  return g+'</svg>';
}
function barChart(vals,o){
  o=o||{};
  var W=640,H=o.h||160,PL=40,PR=12,PT=12,PB=24,plot=H-PT-PB;
  var mx=Math.max.apply(null,vals.map(function(v){return Math.abs(v.y);}).concat([o.signed?0.5:1]));
  var g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">';
  var lbl=function(v){ return o.dec?fmt(v,1):short(v); };
  if(o.signed){
    [1,0,-1].forEach(function(k){
      var y=PT+(1-(k+1)/2)*plot;
      g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="'+(k===0?TC.zero:TC.grid)+'"'+(k===0?' stroke-dasharray="3 3"':'')+'/>';
      g+='<text x="'+(PL-6)+'" y="'+(y+4)+'" fill="'+TC.dim+'" font-size="11" font-family="Azeret Mono, monospace" text-anchor="end">'+(k>0?"+":"")+lbl(k*mx)+'</text>';
    });
  }else{
    [0,.5,1].forEach(function(f){
      var y=PT+f*plot;
      g+='<line x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'" stroke="'+TC.grid+'"/>';
      g+='<text x="'+(PL-6)+'" y="'+(y+4)+'" fill="'+TC.dim+'" font-size="11" font-family="Azeret Mono, monospace" text-anchor="end">'+lbl(mx-f*mx)+'</text>';
    });
  }
  var bw=(W-PL-PR)/vals.length, mid=PT+plot/2;
  vals.forEach(function(v,i){
    var x=PL+i*bw+bw*.18, wd=(bw*.64).toFixed(1), h, y;
    if(o.signed){ h=Math.abs(v.y)/mx*(plot/2); y=v.y>=0?mid-h:mid; }
    else{ h=Math.abs(v.y)/mx*plot; y=H-PB-h; }
    g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+wd+'" height="'+Math.max(o.signed&&v.y!==0?1:0,h).toFixed(1)+'" rx="2" fill="'+(v.c||TC.acc)+'"/>';
    g+='<text x="'+(PL+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" fill="'+TC.dim+'" font-size="11" font-family="Azeret Mono, monospace" text-anchor="middle">'+esc(v.x)+'</text>';
  });
  return g+'</svg>';
}
function hbars(rows,unitLabel){

var statPick=0, statVariant="", volMode="sets", statTab="prog", sortMode="gain", showAll=false;

function tile(k,v,s){ return '<div class="tile"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div><div class="s">'+esc(s)+'</div></div>'; }
function mix(t){

function sessionsDone(){
  var c=0; WEEKS.forEach(function(w){ calFor(w).forEach(function(d,di){ if(d!=="Rest"&&dayComplete(w,di)) c++; }); }); return c;
}
function openDays(){
  var o=[]; WEEKS.forEach(function(w){ calFor(w).forEach(function(d,di){ if(d!=="Rest"&&anyLogged(w,di)&&!dayComplete(w,di)) o.push([w,d]); }); }); return o;

function streakCount(){
  var s=scheduled(); if(!s||s.before) return 0;
  var w=s.after?PG.weeks:s.week, di=s.after?CYCLE-1:s.day, cnt=0, first=true;
  while(w>=1){
    var C=calFor(w);
    if(C[di]!=="Rest"){
      if(dayComplete(w,di)) cnt++;
      else if(!first) break;
    }
    first=false;
    di--; if(di<0){ di=CYCLE-1; w--; }
  }
  return cnt;
}
function trendOf(i,variant){
  var pts=[];
  WEEKS.forEach(function(w){
    if(w===DELOAD||!loggedAt(w,i)) return;
    if(variant&&vOf(w,i)!==variant) return;
    var t=topSet(w,i); if(t!==null) pts.push({x:w,y:t});
  });
  var pct=null;
  if(pts.length>1&&pts[0].y>0) pct=(pts[pts.length-1].y-pts[0].y)/pts[0].y*100;
  return {pts:pts,pct:pct};
}
/* one row per lift actually performed, substitutes counted separately */
function allVariants(){
  var out=[];
  CAT.forEach(function(c,i){
    var vs=variantsOf(i);
    if(!vs.length) vs=[c.name];
    vs.forEach(function(v){
      var t=trendOf(i,v);
      out.push({i:i,v:v,name:v,sub:v!==c.name?c.name:"",pct:t.pct,pts:t.pts});
    });
  });
  return out;
}
function sparkSVG(pts,col){
  var W=132,H=34,P=3;
  if(pts.length<2) return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"></svg>';
  var ys=pts.map(function(p){return p.y;});
  var lo=Math.min.apply(null,ys),hi=Math.max.apply(null,ys);
  if(hi===lo){ lo-=1; hi+=1; }
  var x0=pts[0].x,x1=pts[pts.length-1].x; if(x1===x0) x1=x0+1;
  var X=function(x){ return P+(x-x0)/(x1-x0)*(W-P*2); };
  var Y=function(y){ return P+(1-(y-lo)/(hi-lo))*(H-P*2); };
  var d=pts.map(function(p,k){ return (k?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1); }).join(" ");
  var last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+X(last.x).toFixed(1)+'" cy="'+Y(last.y).toFixed(1)+'" r="2.8" fill="'+col+'"/></svg>';
}
function ringSVG(frac,label,sub){
  var R2=46,CIRC=2*Math.PI*R2;
  return '<svg class="chart" viewBox="0 0 120 120" style="width:120px;height:120px;flex:0 0 120px">'+
    '<circle cx="60" cy="60" r="'+R2+'" fill="none" stroke="'+TC.surf2+'" stroke-width="11"/>'+
    '<circle cx="60" cy="60" r="'+R2+'" fill="none" stroke="'+TC.acc+'" stroke-width="11" stroke-linecap="round" '+
    'stroke-dasharray="'+(CIRC*frac).toFixed(1)+' '+CIRC.toFixed(1)+'" transform="rotate(-90 60 60)"/>'+
    '<text x="60" y="'+(sub?62:70)+'" text-anchor="middle" dominant-baseline="auto" fill="'+TC.txt+'" font-size="26" font-weight="600" font-family="Azeret Mono, monospace">'+label+'</text>'+
    (sub?'<text x="60" y="80" text-anchor="middle" fill="'+TC.mut+'" font-size="11" font-family="Archivo, sans-serif">'+sub+'</text>':'')+'</svg>';
}
function prEvents(){
  var out=[];
  CAT.forEach(function(c,i){
    variantsOf(i).forEach(function(vr){
      var best=null;
      WEEKS.forEach(function(w){
        if(w===DELOAD||!loggedAt(w,i)||vOf(w,i)!==vr) return;
        var q=bestE1(w,i); if(q===null) return;
        if(best===null){ best=q; return; }
        if(q>best+0.5){ out.push({name:vr,w:w,v:q,gain:q-best,i:i,vr:vr}); best=q; }
      });
    });
  });
  out.sort(function(a,b){ return b.w-a.w||b.gain-a.gain; });
  return out;
}
function progTab(){

  WEEKS.forEach(function(w){ CAT.forEach(function(c,i){ vol+=volume(w,i); setsDone+=setCount(w,i); }); });
  var open=openDays(), prs=prEvents(), str=streakCount();

    '<div class="rs">'+(str>1?str+' in a row':'Finish your next one to start a streak')+'</div>'+
    '<div class="rs">'+short(vol)+' '+S.unit+' across '+setsDone+' sets</div></div></div>'+
    '<div style="margin-top:12px">'+gridHTML()+'</div></div>';

    tile("Avg gain",avg===null?"\u2014":(avg>0?"+":"")+fmt(avg,0)+"%","across your lifts")+'</div>';

  /* lift grid, top eight by default */
  moving.sort(function(a,b){ return sortMode==="stall"?(a.pct-b.pct):sortMode==="az"?(a.name<b.name?-1:1):(b.pct-a.pct); });
  var rest=trends.filter(function(t){ return t.pct===null; });
  if(sortMode==="az") rest.sort(function(a,b){ return a.name<b.name?-1:1; });
  var list=moving.concat(rest), shown=showAll?list:list.slice(0,8);

    return '<button class="chip'+(sortMode===o[0]?" on":"")+'" data-sort="'+o[0]+'">'+o[1]+'</button>'; }).join("")+'</div>';
  h+='<div class="sgrid">';

    h+='<div class="scell" data-act="exsheet" data-i="'+t.i+'" data-vr="'+esc(t.v)+'"><div class="sn">'+esc(t.name)+

       sparkSVG(t.pts,col)+'<div class="sp" style="color:'+col+'">'+(t.pct===null?"\u2014":(t.pct>0?"+":"")+fmt(t.pct,1)+"%")+'</div></div>';

  h+='</div>';

  else{

    h+=hbars(top.map(function(p){
      return {k:p.name.length>15?p.name.slice(0,14)+"\u2026":p.name,c:TC.up,v:p.gain,t:"+"+fmt(p.gain,0)+" \u00b7 W"+p.w};
    }),null);

  h+='</div>';

        if((DELOAD&&w===DELOAD)||vOf(w,i)!==vr) return;
        var q=bestE1(w,i); if(q===null) return;

      });
      if(b1!==null&&b2!==null) bl.push({name:vr,pct:(b2-b1)/b1*100});
    });
  });
  bl.sort(function(a,b){ return b.pct-a.pct; });

function effortTab(){

/* ---------- input ---------- */
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="bwin"){ var v=t.value.trim(); if(v==="") delete S.bw[today()]; else S.bw[today()]=v; save(); return; }
  if(t.dataset.i===undefined) return;
  var i=+t.dataset.i,f=t.dataset.f;
  if(f==="note"){ setE(S.week,i,{note:t.value}); return; }
  if(f==="load"||f==="reps"||f==="rir"){
    var e=E(S.week,i),s=t.dataset.s,cur={};
    for(var q in (e[s]||{})) cur[q]=e[s][q];
    cur[f]=t.value;
    var patch={}; patch[s]=cur;
    if(isBw(i)&&e.bw===undefined){ var lb=latestBw(); if(lb!==null) patch.bw=String(lb); }
    setE(S.week,i,patch);
    var card=t.closest(".card"); if(card) card.classList.toggle("done",loggedAt(S.week,i));
    var box=t.closest(".set"); if(box){ var ee=E(S.week,i)[s]||{}; box.classList.toggle("filled",!!(ee.load||(isBw(i)&&ee.reps))); }
    if(f!=="rir") maybeAuto(i,s);
    refreshFinish();
  }
});

/* ---------- clicks ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act],[data-day],[data-v]");
  if(!el) return;
  if(el.dataset.v){ S.view=el.dataset.v; render(); return; }
  var act=el.dataset.act;
  if(el.dataset.day!==undefined&&!act){ S.day=+el.dataset.day; S.open={}; render(); return; }
  var i=el.dataset.i!==undefined?+el.dataset.i:null;
  if(act==="rest"){ startT(+el.dataset.sec,exName(S.week,i),i); return; }
  if(act==="open"){ S.open[i]=!S.open[i]; render(true); return; }
  if(act==="skip"){ setE(S.week,i,{skipped:true}); render(true); return; }
  if(act==="unskip"){ setE(S.week,i,{skipped:false}); render(true); return; }
  if(act==="copy"){
    var p=prevOf(S.week,i); if(!p) return;
    var patch={};

  if(act==="resolve"){
    var opened=[];

    var nm=function(x){ return "\u2022 "+exName(S.week,x); };
    var msg="Finish this workout?";

    if(partial.length) msg+="\n\nMissing reps or RIR:\n"+partial.map(nm).join("\n");

  }

  if(act==="exsheet"){ statPick=i; statVariant=el.dataset.vr||""; openSheet("ex"); return; }
  if(act==="sched"){ openSheet("sched"); return; }
